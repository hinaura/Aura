name: Publish auraOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest successful build
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: release.yml
          workflow_conclusion: success
          name: auraOS-linux-6.12.104-generic
          path: ./release
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: auraOS ${{ inputs.tag }}
          files: |
            ./release/auraOS-kernel-6.12.104-generic-auraOS-x86_64.tar.gz
            ./release/auraOS-kernel-6.12.104-generic-auraOS-x86_64.tar.gz.sha256
          generate_release_notes: true
