name: 'Maximize build disk space and build auraOS kernel'
description: 'Maximize build disk space, download Ubuntu Linux 6.8 source, configure a broad x86_64 kernel, build it with diagnostics, and package the result'
branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  root-reserve-mb:
    description: 'Space to leave free on the root filesystem.'
    required: false
    default: '1536'

  temp-reserve-mb:
    description: 'Space to leave free on the temporary filesystem when available.'
    required: false
    default: '512'

  swap-size-mb:
    description: 'Swap space to create.'
    required: false
    default: '4096'

  overprovision-lvm:
    description: 'Use sparse LVM backing files when possible.'
    required: false
    default: 'true'

  build-mount-path:
    description: 'Build filesystem mount path. Defaults to $GITHUB_WORKSPACE.'
    required: false

  build-mount-path-ownership:
    description: 'Ownership for the build mount.'
    required: false
    default: ''

  pv-loop-path:
    description: 'LVM backing file on root filesystem.'
    required: false
    default: '/pv.img'

  tmp-pv-loop-path:
    description: 'LVM backing file on temporary filesystem.'
    required: false
    default: '/mnt/tmp-pv.img'

  remove-dotnet:
    description: 'Remove .NET runtime and libraries.'
    required: false
    default: 'true'

  remove-android:
    description: 'Remove Android SDKs and tools.'
    required: false
    default: 'true'

  remove-haskell:
    description: 'Remove GHC/Haskell artifacts.'
    required: false
    default: 'true'

  remove-codeql:
    description: 'Remove CodeQL bundles.'
    required: false
    default: 'true'

  remove-docker-images:
    description: 'Remove cached Docker images.'
    required: false
    default: 'true'

  kernel-version:
    description: 'Ubuntu kernel source version.'
    required: false
    default: '6.8.0-138'

  kernel-source-revision:
    description: 'Ubuntu source package revision.'
    required: false
    default: '6.8.0-138.138'

  kernel-localversion:
    description: 'Additional local version appended to the kernel release.'
    required: false
    default: '-generic-auraOS'

  kernel-build-user:
    description: 'Kernel build user metadata.'
    required: false
    default: 'aura'

  kernel-build-host:
    description: 'Kernel build host metadata.'
    required: false
    default: 'aura'

  kernel-build-version:
    description: 'Kernel build version metadata.'
    required: false
    default: '1'

  kernel-build-timestamp:
    description: 'Reproducible kernel build timestamp.'
    required: false
    default: '2026-08-20 00:00:00'

  kernel-config:
    description: |
      Kernel configuration mode:
      allmodconfig = maximum practical module coverage,
      allyesconfig = maximum practical built-in coverage,
      allnoconfig = minimal configuration.
    required: false
    default: 'allmodconfig'

  kernel-jobs:
    description: 'Number of parallel kernel build jobs. Defaults to nproc - 1.'
    required: false
    default: ''

  kernel-verbose:
    description: 'Enable verbose kernel compilation output.'
    required: false
    default: 'true'

runs:
  using: "composite"

  steps:

    - name: Check runner and initial resources
      shell: bash
      run: |
        set -euo pipefail

        echo "=============================================="
        echo " auraOS kernel build environment"
        echo "=============================================="

        echo
        echo "Runner:"
        uname -a

        echo
        echo "OS:"
        cat /etc/os-release || true

        echo
        echo "Architecture:"
        ARCH="$(uname -m)"
        echo "${ARCH}"

        if [[ "${ARCH}" != "x86_64" ]]; then
          echo "ERROR: This action currently produces x86_64 artifacts."
          exit 1
        fi

        echo
        echo "CPU:"
        nproc

        echo
        echo "Memory:"
        free -h

        echo
        echo "Swap:"
        swapon --show || true

        echo
        echo "Filesystem:"
        df -hT

        echo
        echo "Inodes:"
        df -ih

        echo
        echo "Temporary directories:"
        ls -ld /tmp /var/tmp 2>/dev/null || true
        ls -ld /mnt 2>/dev/null || true

        echo
        echo "Tool versions:"
        bash --version | head -n 1 || true
        gcc --version | head -n 1 || true
        g++ --version | head -n 1 || true
        make --version | head -n 1 || true
        ld --version | head -n 1 || true
        dpkg --version | head -n 1 || true

    - name: Maximize build disk space
      shell: bash
      run: |
        set -euo pipefail

        BUILD_MOUNT_PATH="${{ inputs.build-mount-path }}"
        if [[ -z "${BUILD_MOUNT_PATH}" ]]; then
          BUILD_MOUNT_PATH="${GITHUB_WORKSPACE}"
        fi

        ACTUAL_OWNER="${{ inputs.build-mount-path-ownership }}"
        if [[ -z "${ACTUAL_OWNER}" ]]; then
          ACTUAL_OWNER="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
        fi

        ROOT_RESERVE_MB="${{ inputs.root-reserve-mb }}"
        TEMP_RESERVE_MB="${{ inputs.temp-reserve-mb }}"
        SWAP_SIZE_MB="${{ inputs.swap-size-mb }}"

        if ! [[ "${ROOT_RESERVE_MB}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: root-reserve-mb must be numeric."
          exit 1
        fi

        if ! [[ "${TEMP_RESERVE_MB}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: temp-reserve-mb must be numeric."
          exit 1
        fi

        if ! [[ "${SWAP_SIZE_MB}" =~ ^[0-9]+$ ]]; then
          echo "ERROR: swap-size-mb must be numeric."
          exit 1
        fi

        if (( SWAP_SIZE_MB < 1024 )); then
          echo "ERROR: swap-size-mb should be at least 1024 MiB."
          exit 1
        fi

        echo "Build mount:   ${BUILD_MOUNT_PATH}"
        echo "Mount owner:   ${ACTUAL_OWNER}"
        echo "Root reserve:  ${ROOT_RESERVE_MB} MiB"
        echo "Temp reserve:  ${TEMP_RESERVE_MB} MiB"
        echo "Swap:          ${SWAP_SIZE_MB} MiB"

        echo
        echo "Removing unnecessary preinstalled software..."

        if [[ "${{ inputs.remove-dotnet }}" == "true" ]]; then
          sudo rm -rf /usr/share/dotnet
        fi

        if [[ "${{ inputs.remove-android }}" == "true" ]]; then
          sudo rm -rf /usr/local/lib/android
        fi

        if [[ "${{ inputs.remove-haskell }}" == "true" ]]; then
          sudo rm -rf /opt/ghc
        fi

        if [[ "${{ inputs.remove-codeql }}" == "true" ]]; then
          sudo rm -rf /opt/hostedtoolcache/CodeQL
        fi

        if [[ "${{ inputs.remove-docker-images }}" == "true" ]] &&
           command -v docker >/dev/null 2>&1; then
          sudo docker system prune -af --volumes || true
        fi

        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

        echo
        echo "Removing existing swap..."

        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile /swapfile

        VG_NAME="buildvg"
        ROOT_LOOP_DEV=""
        TMP_LOOP_DEV=""

        cleanup_lvm() {
          set +e

          echo
          echo "LVM cleanup..."

          if [[ -n "${VG_NAME}" ]]; then
            sudo umount "${BUILD_MOUNT_PATH}" 2>/dev/null || true
            sudo lvremove -fy "${VG_NAME}" 2>/dev/null || true
            sudo vgremove -fy "${VG_NAME}" 2>/dev/null || true
          fi

          if [[ -n "${ROOT_LOOP_DEV}" ]]; then
            sudo losetup -d "${ROOT_LOOP_DEV}" 2>/dev/null || true
          fi

          if [[ -n "${TMP_LOOP_DEV}" ]]; then
            sudo losetup -d "${TMP_LOOP_DEV}" 2>/dev/null || true
          fi
        }

        trap cleanup_lvm EXIT

        sudo mkdir -p "${BUILD_MOUNT_PATH}"

        if sudo vgs "${VG_NAME}" >/dev/null 2>&1; then
          echo "ERROR: Volume group ${VG_NAME} already exists."
          sudo vgdisplay "${VG_NAME}" || true
          exit 1
        fi

        ROOT_FREE_KB="$(
          df --block-size=1024 --output=avail / |
          tail -n 1 |
          tr -d '[:space:]'
        )"

        ROOT_RESERVE_KB="$((ROOT_RESERVE_MB * 1024))"
        MIN_LVM_KB="$((4 * 1024 * 1024))"

        if (( ROOT_FREE_KB <= ROOT_RESERVE_KB + MIN_LVM_KB )); then
          echo "WARNING: insufficient root free space for an LVM build volume."
          echo "Continuing with the original workspace filesystem."
          trap - EXIT
          exit 0
        fi

        ROOT_LVM_SIZE_KB="$((ROOT_FREE_KB - ROOT_RESERVE_KB))"
        ROOT_LVM_SIZE_BYTES="$((ROOT_LVM_SIZE_KB * 1024))"

        echo
        echo "Root free before LVM: ${ROOT_FREE_KB} KiB"
        echo "Root LVM size:       ${ROOT_LVM_SIZE_KB} KiB"

        sudo rm -f "${{ inputs.pv-loop-path }}"
        sudo touch "${{ inputs.pv-loop-path }}"

        if [[ "${{ inputs.overprovision-lvm }}" == "true" ]]; then
          sudo truncate \
            -s "${ROOT_LVM_SIZE_BYTES}" \
            "${{ inputs.pv-loop-path }}"
        else
          sudo fallocate \
            -l "${ROOT_LVM_SIZE_BYTES}" \
            "${{ inputs.pv-loop-path }}"
        fi

        ROOT_LOOP_DEV="$(
          sudo losetup \
            --find \
            --show \
            "${{ inputs.pv-loop-path }}"
        )"

        echo "Root loop device: ${ROOT_LOOP_DEV}"

        sudo pvcreate \
          -ff \
          -y \
          "${ROOT_LOOP_DEV}"

        PV_DEVICES=("${ROOT_LOOP_DEV}")

        if mountpoint -q /mnt 2>/dev/null; then
          TMP_FREE_KB="$(
            df --block-size=1024 --output=avail /mnt |
            tail -n 1 |
            tr -d '[:space:]'
          )"

          TEMP_RESERVE_KB="$((TEMP_RESERVE_MB * 1024))"

          if (( TMP_FREE_KB > TEMP_RESERVE_KB + MIN_LVM_KB )); then
            TMP_LVM_SIZE_KB="$((TMP_FREE_KB - TEMP_RESERVE_KB))"
            TMP_LVM_SIZE_BYTES="$((TMP_LVM_SIZE_KB * 1024))"

            echo
            echo "Temp free before LVM: ${TMP_FREE_KB} KiB"
            echo "Temp LVM size:       ${TMP_LVM_SIZE_KB} KiB"

            sudo mkdir -p \
              "$(dirname "${{ inputs.tmp-pv-loop-path }}")"

            sudo rm -f "${{ inputs.tmp-pv-loop-path }}"
            sudo touch "${{ inputs.tmp-pv-loop-path }}"

            if [[ "${{ inputs.overprovision-lvm }}" == "true" ]]; then
              sudo truncate \
                -s "${TMP_LVM_SIZE_BYTES}" \
                "${{ inputs.tmp-pv-loop-path }}"
            else
              sudo fallocate \
                -l "${TMP_LVM_SIZE_BYTES}" \
                "${{ inputs.tmp-pv-loop-path }}"
            fi

            TMP_LOOP_DEV="$(
              sudo losetup \
                --find \
                --show \
                "${{ inputs.tmp-pv-loop-path }}"
            )"

            echo "Temp loop device: ${TMP_LOOP_DEV}"

            sudo pvcreate \
              -ff \
              -y \
              "${TMP_LOOP_DEV}"

            PV_DEVICES+=("${TMP_LOOP_DEV}")
          else
            echo "Not enough free space on /mnt; using root PV only."
          fi
        else
          echo "/mnt is not a separate mounted filesystem; using root PV only."
        fi

        echo
        echo "Creating volume group..."

        sudo vgcreate \
          "${VG_NAME}" \
          "${PV_DEVICES[@]}"

        echo
        echo "Creating swap LV..."

        sudo lvcreate \
          -L "${SWAP_SIZE_MB}M" \
          -n swap \
          "${VG_NAME}"

        sudo mkswap \
          "/dev/${VG_NAME}/swap"

        sudo swapon \
          "/dev/${VG_NAME}/swap"

        echo
        echo "Creating build LV..."

        if ! sudo lvcreate \
          -l 100%FREE \
          -n buildlv \
          "${VG_NAME}"; then
          echo "ERROR: Failed to create build LV."
          sudo vgdisplay "${VG_NAME}" || true
          exit 1
        fi

        sudo mkfs.ext4 \
          -m 0 \
          -E lazy_itable_init=1,lazy_journal_init=1 \
          "/dev/${VG_NAME}/buildlv"

        sudo mount \
          "/dev/${VG_NAME}/buildlv" \
          "${BUILD_MOUNT_PATH}"

        sudo chown \
          "${ACTUAL_OWNER}" \
          "${BUILD_MOUNT_PATH}"

        trap - EXIT

        echo
        echo "Build filesystem:"
        df -hT "${BUILD_MOUNT_PATH}"

        echo
        echo "Build filesystem inodes:"
        df -ih "${BUILD_MOUNT_PATH}"

        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true

        echo
        echo "Swap:"
        swapon --show || true

    - name: Install kernel build dependencies
      shell: bash
      run: |
        set -euo pipefail

        sudo apt-get update

        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential \
          gcc \
          g++ \
          gcc-multilib \
          g++-multilib \
          libc6-dev \
          libc6-dev-i386 \
          bc \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          dwarves \
          pkg-config \
          cpio \
          rsync \
          kmod \
          fakeroot \
          dpkg-dev \
          debhelper \
          libncurses-dev \
          libcap-dev \
          libcap-ng-dev \
          libaudit-dev \
          git \
          curl \
          ca-certificates \
          xz-utils \
          zstd \
          bzip2 \
          gzip \
          openssl \
          initramfs-tools \
          lz4 \
          xorriso \
          dosfstools \
          e2fsprogs \
          file \
          tar \
          gzip \
          perl \
          python3 \
          python3-minimal

        echo
        echo "Toolchain:"
        gcc --version | head -n 1
        g++ --version | head -n 1
        make --version | head -n 1
        ld --version | head -n 1
        pahole --version || true
        openssl version

        echo
        echo "Compiler multilib test:"

        printf 'int main(void) { return 0; }\n' > /tmp/aura-test.c

        gcc \
          -m32 \
          /tmp/aura-test.c \
          -o /tmp/aura-test32

        file /tmp/aura-test32

        gcc \
          -m64 \
          /tmp/aura-test.c \
          -o /tmp/aura-test64

        file /tmp/aura-test64

        rm -f \
          /tmp/aura-test.c \
          /tmp/aura-test32 \
          /tmp/aura-test64

        echo
        echo "Required binaries:"

        for tool in \
          gcc \
          g++ \
          make \
          ld \
          as \
          ar \
          nm \
          objcopy \
          strip \
          bc \
          flex \
          bison \
          perl \
          rsync \
          depmod \
          mkinitramfs \
          dpkg-deb \
          curl \
          tar \
          zstd \
          lz4 \
          python3; do

          if ! command -v "${tool}" >/dev/null 2>&1; then
            echo "ERROR: Required tool not found: ${tool}"
            exit 1
          fi
        done

        echo
        echo "Required headers/libraries check:"

        test -f /usr/include/openssl/ssl.h
        test -f /usr/include/elf.h
        test -f /usr/include/ncurses.h

        echo "Build dependencies check passed."

    - name: Download Ubuntu Linux source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        SOURCE_DEB="${BUILD_ROOT}/linux-source-${{ inputs.kernel-version }}_${{ inputs.kernel-source-revision }}_all.deb"

        mkdir -p "${BUILD_ROOT}"

        URLS=(
          "https://ppa.launchpadcontent.net/canonical-kernel-team/ppa2/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://security.ubuntu.com/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://ftp.rz.uni-wuerzburg.de/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
        )

        downloaded="false"

        for url in "${URLS[@]}"; do
          echo
          echo "Trying:"
          echo "  ${url}"

          rm -f "${SOURCE_DEB}.part"

          if curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 1200 \
            -o "${SOURCE_DEB}.part" \
            "${url}"; then

            if [[ ! -s "${SOURCE_DEB}.part" ]]; then
              echo "Downloaded file is empty."
              rm -f "${SOURCE_DEB}.part"
              continue
            fi

            mv \
              "${SOURCE_DEB}.part" \
              "${SOURCE_DEB}"

            downloaded="true"
            break
          fi
        done

        if [[ "${downloaded}" != "true" ]]; then
          echo
          echo "ERROR: Failed to download Ubuntu Linux source."
          exit 1
        fi

        echo
        echo "Downloaded source package:"
        ls -lh "${SOURCE_DEB}"

        echo
        echo "Checking Debian package:"

        dpkg-deb \
          --info \
          "${SOURCE_DEB}" |
          head -100

        echo
        echo "Checking package contents..."

        dpkg-deb \
          --contents \
          "${SOURCE_DEB}" |
          grep -E \
            'linux-source-6\.8\.0\.tar\.(bz2|xz|zst)$' |
          head -20

        echo
        echo "Extracting source package..."

        rm -rf \
          "${BUILD_ROOT}/source-package" \
          "${SOURCE_DIR}"

        mkdir -p \
          "${BUILD_ROOT}/source-package" \
          "${SOURCE_DIR}"

        dpkg-deb \
          -x \
          "${SOURCE_DEB}" \
          "${BUILD_ROOT}/source-package"

        SOURCE_TARBALL="$(
          find "${BUILD_ROOT}/source-package" \
            -type f \
            \( \
              -name "linux-source-6.8.0.tar.bz2" \
              -o -name "linux-source-6.8.0.tar.xz" \
              -o -name "linux-source-6.8.0.tar.zst" \
            \) |
          head -n 1
        )"

        if [[ -z "${SOURCE_TARBALL}" ]]; then
          echo "ERROR: Kernel source archive not found."

          find "${BUILD_ROOT}/source-package" \
            -type f |
            head -100

          exit 1
        fi

        echo
        echo "Source archive:"
        echo "  ${SOURCE_TARBALL}"

        case "${SOURCE_TARBALL}" in
          *.tar.bz2)
            tar \
              -xjf "${SOURCE_TARBALL}" \
              --strip-components=1 \
              -C "${SOURCE_DIR}"
            ;;
          *.tar.xz)
            tar \
              -xJf "${SOURCE_TARBALL}" \
              --strip-components=1 \
              -C "${SOURCE_DIR}"
            ;;
          *.tar.zst)
            tar \
              --zstd \
              -xf "${SOURCE_TARBALL}" \
              --strip-components=1 \
              -C "${SOURCE_DIR}"
            ;;
          *)
            echo "ERROR: Unsupported archive: ${SOURCE_TARBALL}"
            exit 1
            ;;
        esac

        test -f "${SOURCE_DIR}/Makefile"
        test -f "${SOURCE_DIR}/Kconfig"
        test -d "${SOURCE_DIR}/drivers"
        test -d "${SOURCE_DIR}/kernel"
        test -d "${SOURCE_DIR}/security"

        echo
        echo "Source directory:"
        echo "  ${SOURCE_DIR}"

        echo
        echo "Kernel Makefile:"
        head -n 12 "${SOURCE_DIR}/Makefile"

        echo
        echo "Kernel version reported by source:"

        make \
          -C "${SOURCE_DIR}" \
          kernelversion

        ACTUAL_BASE_VERSION="$(
          make \
            -C "${SOURCE_DIR}" \
            -s \
            kernelversion
        )"

        case "${ACTUAL_BASE_VERSION}" in
          6.8.*)
            ;;
          *)
            echo "ERROR: Expected Linux 6.8 source, got:"
            echo "${ACTUAL_BASE_VERSION}"
            exit 1
            ;;
        esac

        echo
        echo "Driver directories:"

        find "${SOURCE_DIR}/drivers" \
          -mindepth 1 \
          -maxdepth 1 \
          -type d |
          wc -l

    - name: Apply Ubuntu 6.8 build compatibility checks
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"

        cd "${SOURCE_DIR}"

        echo "Checking AppArmor source for known problematic symbols..."

        if grep -R \
             -n \
             --include='*.c' \
             --include='*.h' \
             'spin_is_lock' \
             security/apparmor 2>/dev/null; then

          echo
          echo "Detected AppArmor spin_is_lock usage."
          echo "CONFIG_SECURITY_APPARMOR will be disabled."
        fi

        echo
        echo "Checking RCU list API:"

        grep -n \
          'list_for_each_entry_rcu' \
          include/linux/rculist.h |
          head -5 || true

        echo
        echo "RCU API check completed."

    - name: Configure auraOS kernel
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"

        rm -rf "${OUTPUT_DIR}"
        mkdir -p "${OUTPUT_DIR}"

        cd "${SOURCE_DIR}"

        echo "Cleaning source tree..."

        make mrproper

        CONFIG_EXTRA="${OUTPUT_DIR}/auraOS-extra.config"

        cat > "${CONFIG_EXTRA}" <<'EOF'
CONFIG_MODULES=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y

# ------------------------------------------------------------------
# x86_64 / compatibility
# ------------------------------------------------------------------

CONFIG_64BIT=y
CONFIG_X86=y
CONFIG_X86_64=y
CONFIG_IA32_EMULATION=y

# ------------------------------------------------------------------
# Broad hardware / kernel capabilities
# ------------------------------------------------------------------

CONFIG_PCI=y
CONFIG_PCIEPORTBUS=y
CONFIG_SCSI=m
CONFIG_ATA=m
CONFIG_SATA_AHCI=m
CONFIG_MD=m
CONFIG_DM_CRYPT=m
CONFIG_DRM=m
CONFIG_SOUND=m
CONFIG_HID=m
CONFIG_USB=m
CONFIG_USB_SUPPORT=y
CONFIG_NET=y
CONFIG_INET=y
CONFIG_IPV6=y
CONFIG_WLAN=m
CONFIG_BT=m
CONFIG_INPUT=m
CONFIG_I2C=m
CONFIG_SPI=m
CONFIG_PNP=y
CONFIG_ACPI=y
CONFIG_HWMON=m
CONFIG_RTC_CLASS=m
CONFIG_MTD=m
CONFIG_NVMEM=m
CONFIG_FW_LOADER=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y

# ------------------------------------------------------------------
# Disable known problematic / unnecessary subsystems for this build
# ------------------------------------------------------------------

CONFIG_SECURITY_APPARMOR=n
CONFIG_SECURITY_TOMOYO=n
CONFIG_SECURITY_SMACK=n
CONFIG_SECURITY_LOADPIN=n
CONFIG_SECURITY_LANDLOCK=n
CONFIG_SECURITY_IPE=n
CONFIG_SECURITY_SAFESETID=n
CONFIG_SECURITY_YAMA=n
CONFIG_SECURITY_LOCKDOWN_LSM=n
CONFIG_BPF_LSM=n

# ------------------------------------------------------------------
# Toolchain-sensitive features
# ------------------------------------------------------------------

CONFIG_RUST=n
CONFIG_GCC_PLUGINS=n
CONFIG_WERROR=n
CONFIG_UAPI_HEADER_TEST=n

# ------------------------------------------------------------------
# Debug / instrumentation reduced for CI stability
# ------------------------------------------------------------------

CONFIG_DEBUG_INFO_BTF=n
CONFIG_DEBUG_INFO_BTF_MODULES=n
CONFIG_KASAN=n
CONFIG_KCSAN=n
CONFIG_KFENCE=n
CONFIG_KCOV=n
CONFIG_UBSAN=n
CONFIG_UBSAN_TRAP=n
CONFIG_DEBUG_OBJECTS=n
CONFIG_DEBUG_LIST=n
CONFIG_DEBUG_SG=n
CONFIG_DEBUG_NOTIFIERS=n
CONFIG_DEBUG_KMEMLEAK=n
CONFIG_DEBUG_PAGEALLOC=n
CONFIG_PAGE_POISONING=n
CONFIG_PAGE_EXTENSION=n
CONFIG_SLUB_DEBUG=n
CONFIG_SLAB_FREELIST_HARDENED=n
CONFIG_SLAB_FREELIST_RANDOM=n
CONFIG_SHUFFLE_PAGE_ALLOCATOR=n

# ------------------------------------------------------------------
# Local version
# ------------------------------------------------------------------

CONFIG_LOCALVERSION_AUTO=n
EOF

        export KCONFIG_CONFIG="${OUTPUT_DIR}/.config"
        export KCONFIG_ALLCONFIG="${CONFIG_EXTRA}"

        echo
        echo "Generating base kernel configuration..."

        case "${{ inputs.kernel-config }}" in
          allmodconfig)
            make \
              O="${OUTPUT_DIR}" \
              allmodconfig
            ;;
          allyesconfig)
            make \
              O="${OUTPUT_DIR}" \
              allyesconfig
            ;;
          allnoconfig)
            make \
              O="${OUTPUT_DIR}" \
              allnoconfig
            ;;
          *)
            echo "Unknown kernel-config: ${{ inputs.kernel-config }}"
            exit 1
            ;;
        esac

        echo
        echo "Applying auraOS configuration constraints..."

        make \
          O="${OUTPUT_DIR}" \
          olddefconfig

        unset KCONFIG_ALLCONFIG

        echo
        echo "Applying explicit configuration overrides..."

        "${SOURCE_DIR}/scripts/config" \
          --file "${OUTPUT_DIR}/.config" \
          --disable CONFIG_WERROR \
          --disable CONFIG_RUST \
          --disable CONFIG_GCC_PLUGINS \
          --disable CONFIG_DEBUG_INFO_BTF \
          --disable CONFIG_DEBUG_INFO_BTF_MODULES \
          --disable CONFIG_UAPI_HEADER_TEST \
          --disable CONFIG_SECURITY_APPARMOR \
          --disable CONFIG_SECURITY_TOMOYO \
          --disable CONFIG_SECURITY_SMACK \
          --disable CONFIG_SECURITY_LOADPIN \
          --disable CONFIG_SECURITY_LANDLOCK \
          --disable CONFIG_SECURITY_IPE \
          --disable CONFIG_SECURITY_SAFESETID \
          --disable CONFIG_SECURITY_YAMA \
          --disable CONFIG_SECURITY_LOCKDOWN_LSM \
          --disable CONFIG_BPF_LSM \
          --disable CONFIG_KASAN \
          --disable CONFIG_KCSAN \
          --disable CONFIG_KFENCE \
          --disable CONFIG_KCOV \
          --disable CONFIG_UBSAN \
          --disable CONFIG_UBSAN_TRAP \
          --disable CONFIG_DEBUG_OBJECTS \
          --disable CONFIG_DEBUG_LIST \
          --disable CONFIG_DEBUG_SG \
          --disable CONFIG_DEBUG_NOTIFIERS \
          --disable CONFIG_DEBUG_KMEMLEAK \
          --disable CONFIG_DEBUG_PAGEALLOC \
          --disable CONFIG_PAGE_POISONING \
          --disable CONFIG_PAGE_EXTENSION \
          --disable CONFIG_SLUB_DEBUG \
          --disable CONFIG_SLAB_FREELIST_HARDENED \
          --disable CONFIG_SLAB_FREELIST_RANDOM \
          --disable CONFIG_SHUFFLE_PAGE_ALLOCATOR \
          --enable CONFIG_MODULES \
          --enable CONFIG_KALLSYMS \
          --enable CONFIG_KALLSYMS_ALL \
          --enable CONFIG_64BIT \
          --enable CONFIG_X86 \
          --enable CONFIG_X86_64 \
          --enable CONFIG_IA32_EMULATION \
          --disable CONFIG_LOCALVERSION_AUTO \
          --set-str CONFIG_LOCALVERSION "${{ inputs.kernel-localversion }}"

        echo
        echo "Re-resolving Kconfig dependencies..."

        make \
          O="${OUTPUT_DIR}" \
          olddefconfig

        echo
        echo "Running configuration sanity checks..."

        required_y=(
          CONFIG_MODULES
          CONFIG_X86_64
          CONFIG_X86
          CONFIG_64BIT
          CONFIG_KALLSYMS
        )

        for cfg in "${required_y[@]}"; do
          if ! grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} must be enabled as y."
            exit 1
          fi
        done

        disabled_configs=(
          CONFIG_SECURITY_APPARMOR
          CONFIG_SECURITY_TOMOYO
          CONFIG_SECURITY_SMACK
          CONFIG_SECURITY_LOADPIN
          CONFIG_SECURITY_LANDLOCK
          CONFIG_SECURITY_IPE
          CONFIG_SECURITY_SAFESETID
          CONFIG_SECURITY_YAMA
          CONFIG_SECURITY_LOCKDOWN_LSM
          CONFIG_BPF_LSM
          CONFIG_UAPI_HEADER_TEST
          CONFIG_WERROR
          CONFIG_RUST
          CONFIG_GCC_PLUGINS
          CONFIG_DEBUG_INFO_BTF
          CONFIG_DEBUG_INFO_BTF_MODULES
          CONFIG_KASAN
          CONFIG_KCSAN
          CONFIG_KFENCE
          CONFIG_KCOV
          CONFIG_UBSAN
          CONFIG_UBSAN_TRAP
          CONFIG_DEBUG_OBJECTS
          CONFIG_DEBUG_LIST
          CONFIG_DEBUG_SG
          CONFIG_DEBUG_NOTIFIERS
          CONFIG_DEBUG_KMEMLEAK
          CONFIG_DEBUG_PAGEALLOC
          CONFIG_PAGE_POISONING
          CONFIG_PAGE_EXTENSION
          CONFIG_SLUB_DEBUG
          CONFIG_SLAB_FREELIST_HARDENED
          CONFIG_SLAB_FREELIST_RANDOM
          CONFIG_SHUFFLE_PAGE_ALLOCATOR
        )

        for cfg in "${disabled_configs[@]}"; do
          if grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config" ||
             grep -q "^${cfg}=m$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} must be disabled."
            exit 1
          fi
        done

        if ! grep -q '^CONFIG_IA32_EMULATION=y$' \
          "${OUTPUT_DIR}/.config"; then
          echo "ERROR: CONFIG_IA32_EMULATION must be enabled."
          exit 1
        fi

        echo
        echo "Selected configuration:"

        grep -E \
          '^(CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_X86_64|CONFIG_X86|CONFIG_64BIT|CONFIG_IA32_EMULATION|CONFIG_SECURITY_APPARMOR|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_BTF_MODULES|CONFIG_UAPI_HEADER_TEST|CONFIG_WERROR|CONFIG_RUST|CONFIG_GCC_PLUGINS|CONFIG_KASAN|CONFIG_KCSAN|CONFIG_KFENCE|CONFIG_UBSAN)=' \
          "${OUTPUT_DIR}/.config" || true

        echo
        echo "Security configuration:"

        grep -E \
          '^(CONFIG_SECURITY=|CONFIG_SECURITY_[A-Za-z0-9_]+=|CONFIG_LSM=)' \
          "${OUTPUT_DIR}/.config" |
          head -100 || true

        echo
        echo "Configuration statistics:"

        printf '  Built-in: '
        grep -Ec '^CONFIG_[A-Za-z0-9_]+=y$' \
          "${OUTPUT_DIR}/.config" || true

        printf '  Modules:  '
        grep -Ec '^CONFIG_[A-Za-z0-9_]+=m$' \
          "${OUTPUT_DIR}/.config" || true

        printf '  Disabled: '
        grep -Ec '^# CONFIG_[A-Za-z0-9_]+ is not set$' \
          "${OUTPUT_DIR}/.config" || true

        echo
        echo "Checking generated config consistency..."

        make \
          O="${OUTPUT_DIR}" \
          listnewconfig </dev/null || true

        echo
        echo "Final kernel release preview:"

        make \
          O="${OUTPUT_DIR}" \
          -s \
          kernelrelease

    - name: Pre-build resource check
      shell: bash
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"

        echo "=============================================="
        echo " Pre-build resource check"
        echo "=============================================="

        echo
        echo "Disk:"
        df -hT "${GITHUB_WORKSPACE}"

        echo
        echo "Inodes:"
        df -ih "${GITHUB_WORKSPACE}"

        echo
        echo "Memory:"
        free -h

        echo
        echo "Swap:"
        swapon --show || true

        echo
        echo "Build directory size:"
        du -sh \
          "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" \
          "${BUILD_ROOT}/build" \
          2>/dev/null || true

        echo
        echo "Available space on all filesystems:"
        df -h

        echo
        echo "Kernel configuration file:"
        ls -lh \
          "${BUILD_ROOT}/build/.config"

        echo
        echo "Kernel config critical checks:"

        for cfg in \
          CONFIG_MODULES \
          CONFIG_X86_64 \
          CONFIG_X86 \
          CONFIG_64BIT \
          CONFIG_IA32_EMULATION; do

          grep \
            "^${cfg}=" \
            "${BUILD_ROOT}/build/.config" ||
            true
        done

        echo
        echo "AppArmor:"
        grep \
          -E \
          '^(CONFIG_SECURITY_APPARMOR|CONFIG_SECURITY=|CONFIG_LSM=)' \
          "${BUILD_ROOT}/build/.config" ||
          true

    - name: Build auraOS kernel
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        KBUILD_BUILD_USER: ${{ inputs.kernel-build-user }}
        KBUILD_BUILD_HOST: ${{ inputs.kernel-build-host }}
        KBUILD_BUILD_TIMESTAMP: ${{ inputs.kernel-build-timestamp }}
        KBUILD_BUILD_VERSION: ${{ inputs.kernel-build-version }}
        LOCALVERSION: ${{ inputs.kernel-localversion }}
        SOURCE_DATE_EPOCH: '1787184000'
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"

        cd "${SOURCE_DIR}"

        CPU_COUNT="$(nproc)"

        if [[ -n "${{ inputs.kernel-jobs }}" ]]; then
          JOBS="${{ inputs.kernel-jobs }}"

          if ! [[ "${JOBS}" =~ ^[0-9]+$ ]] || (( JOBS < 1 )); then
            echo "ERROR: kernel-jobs must be a positive integer."
            exit 1
          fi
        else
          if (( CPU_COUNT > 4 )); then
            JOBS="$((CPU_COUNT - 2))"
          elif (( CPU_COUNT > 2 )); then
            JOBS="$((CPU_COUNT - 1))"
          else
            JOBS=1
          fi
        fi

        MAX_SAFE_JOBS=$((CPU_COUNT + 1))

        if (( JOBS > MAX_SAFE_JOBS )); then
          echo "Requested jobs (${JOBS}) exceeds safe limit (${MAX_SAFE_JOBS})."
          JOBS="${MAX_SAFE_JOBS}"
        fi

        if [[ "${{ inputs.kernel-verbose }}" == "true" ]]; then
          VERBOSE=(V=1)
        else
          VERBOSE=()
        fi

        echo "=============================================="
        echo " Building auraOS Linux kernel"
        echo "=============================================="
        echo "Kernel version:  ${{ inputs.kernel-version }}"
        echo "Local version:   ${LOCALVERSION}"
        echo "Jobs:            ${JOBS}"
        echo "CPU count:       ${CPU_COUNT}"
        echo "Architecture:    $(uname -m)"
        echo "Build user:      ${KBUILD_BUILD_USER}"
        echo "Build host:      ${KBUILD_BUILD_HOST}"
        echo "Build version:   ${KBUILD_BUILD_VERSION}"
        echo "Build timestamp: ${KBUILD_BUILD_TIMESTAMP}"
        echo "=============================================="

        export MAKEFLAGS="-Otarget"

        COMMON_MAKE_ARGS=(
          O="${OUTPUT_DIR}"
          KBUILD_BUILD_USER="${KBUILD_BUILD_USER}"
          KBUILD_BUILD_HOST="${KBUILD_BUILD_HOST}"
          KBUILD_BUILD_VERSION="${KBUILD_BUILD_VERSION}"
          KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP}"
          LOCALVERSION="${LOCALVERSION}"
        )

        echo
        echo "=== Stage 1/2: bzImage ==="

        set +e

        make \
          "${COMMON_MAKE_ARGS[@]}" \
          -j"${JOBS}" \
          "${VERBOSE[@]}" \
          bzImage

        IMAGE_STATUS=$?

        set -e

        if (( IMAGE_STATUS != 0 )); then
          echo
          echo "=============================================="
          echo " bzImage failed"
          echo "=============================================="

          echo
          echo "Running retry with -j1 V=1."

          make \
            "${COMMON_MAKE_ARGS[@]}" \
            -j1 \
            V=1 \
            bzImage

          exit 1
        fi

        echo
        echo "=== Stage 2/2: modules ==="

        set +e

        make \
          "${COMMON_MAKE_ARGS[@]}" \
          -j"${JOBS}" \
          "${VERBOSE[@]}" \
          modules

        MODULE_STATUS=$?

        set -e

        if (( MODULE_STATUS != 0 )); then
          echo
          echo "=============================================="
          echo " Module build failed"
          echo "=============================================="

          echo
          echo "Running retry with -j1 V=1."

          make \
            "${COMMON_MAKE_ARGS[@]}" \
            -j1 \
            V=1 \
            modules

          exit 1
        fi

        echo
        echo "Kernel compilation completed."

        echo
        echo "Kernel release:"

        make \
          O="${OUTPUT_DIR}" \
          -s \
          kernelrelease

        echo
        echo "Built kernel image:"

        ls -lh \
          "${OUTPUT_DIR}/arch/x86/boot/bzImage"

        echo
        echo "Build products:"

        test -s \
          "${OUTPUT_DIR}/arch/x86/boot/bzImage"

        test -f \
          "${OUTPUT_DIR}/System.map"

        echo "Kernel image validation passed."

    - name: Verify built kernel configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"

        cd "${SOURCE_DIR}"

        echo "Running final post-build config verification..."

        make \
          O="${OUTPUT_DIR}" \
          -s \
          kernelrelease

        for cfg in \
          CONFIG_MODULES \
          CONFIG_X86_64 \
          CONFIG_X86 \
          CONFIG_64BIT \
          CONFIG_IA32_EMULATION; do

          if ! grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} is missing after build."
            exit 1
          fi
        done

        for cfg in \
          CONFIG_SECURITY_APPARMOR \
          CONFIG_UAPI_HEADER_TEST \
          CONFIG_WERROR \
          CONFIG_RUST \
          CONFIG_GCC_PLUGINS \
          CONFIG_DEBUG_INFO_BTF \
          CONFIG_DEBUG_INFO_BTF_MODULES \
          CONFIG_KASAN \
          CONFIG_KCSAN \
          CONFIG_KFENCE \
          CONFIG_KCOV \
          CONFIG_UBSAN; do

          if grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config" ||
             grep -q "^${cfg}=m$" "${OUTPUT_DIR}/.config"; then

            echo "ERROR: ${cfg} unexpectedly enabled."
            exit 1
          fi
        done

        echo
        echo "Critical configuration verified."

    - name: Install modules and generate initramfs
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"

        cd "${SOURCE_DIR}"

        RELEASE="$(
          make \
            O="${OUTPUT_DIR}" \
            -s \
            kernelrelease
        )"

        echo "Kernel release: ${RELEASE}"

        rm -rf "${PACKAGE_DIR}"

        mkdir -p \
          "${PACKAGE_DIR}/boot" \
          "${PACKAGE_DIR}/modules"

        echo
        echo "Installing modules into package root..."

        make \
          O="${OUTPUT_DIR}" \
          modules_install \
          INSTALL_MOD_PATH="${PACKAGE_DIR}/modules" \
          INSTALL_MOD_STRIP=1

        MODULE_ROOT="${PACKAGE_DIR}/modules/lib/modules/${RELEASE}"

        if [[ ! -d "${MODULE_ROOT}" ]]; then
          echo "ERROR: Module installation directory not found:"
          echo "  ${MODULE_ROOT}"
          exit 1
        fi

        echo
        echo "Running depmod in package tree..."

        sudo depmod \
          -b "${PACKAGE_DIR}/modules" \
          "${RELEASE}"

        if [[ ! -f "${MODULE_ROOT}/modules.dep" ]]; then
          echo "ERROR: modules.dep was not generated."
          exit 1
        fi

        echo
        echo "Preparing temporary host module tree..."

        sudo rm -rf \
          "/lib/modules/${RELEASE}"

        sudo mkdir -p \
          "/lib/modules/${RELEASE}"

        sudo rsync \
          -a \
          "${MODULE_ROOT}/" \
          "/lib/modules/${RELEASE}/"

        sudo depmod \
          "${RELEASE}"

        echo
        echo "Generating initramfs..."

        sudo mkinitramfs \
          -o "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}" \
          "${RELEASE}"

        echo
        echo "Copying kernel image..."

        cp \
          "${OUTPUT_DIR}/arch/x86/boot/bzImage" \
          "${PACKAGE_DIR}/boot/vmlinuz-${RELEASE}"

        if [[ -f "${OUTPUT_DIR}/System.map" ]]; then
          cp \
            "${OUTPUT_DIR}/System.map" \
            "${PACKAGE_DIR}/boot/System.map-${RELEASE}"
        fi

        if [[ -f "${OUTPUT_DIR}/.config" ]]; then
          cp \
            "${OUTPUT_DIR}/.config" \
            "${PACKAGE_DIR}/boot/config-${RELEASE}"
        fi

        echo
        echo "Checking generated initramfs:"

        ls -lh \
          "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"

        test -s \
          "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"

        echo
        echo "Removing temporary system modules..."

        sudo rm -rf \
          "/lib/modules/${RELEASE}"

        echo
        echo "Package tree:"

        find "${PACKAGE_DIR}" \
          -maxdepth 6 \
          -type f \
          -printf '%p %k KB\n' |
          sort

        echo
        echo "Package sizes:"

        du -sh \
          "${PACKAGE_DIR}/boot" \
          "${PACKAGE_DIR}/modules"

    - name: Collect build diagnostics
      if: always()
      shell: bash
      run: |
        set +e

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        OUTPUT_DIR="${BUILD_ROOT}/build"

        echo "=============================================="
        echo " Build diagnostics"
        echo "=============================================="

        echo
        echo "Disk:"
        df -hT

        echo
        echo "Inodes:"
        df -ih

        echo
        echo "Memory:"
        free -h

        echo
        echo "Swap:"
        swapon --show || true

        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true

        echo
        echo "Top build directories:"

        du -xhd2 \
          "${BUILD_ROOT}" \
          2>/dev/null |
          sort -h |
          tail -50

        echo
        echo "Recent compiler command files:"

        find "${OUTPUT_DIR}" \
          -type f \
          -name '*.cmd' |
          tail -50

        echo
        echo "Configuration:"

        grep -E \
          '^(CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_X86_64|CONFIG_X86|CONFIG_64BIT|CONFIG_IA32_EMULATION|CONFIG_SECURITY_APPARMOR|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_BTF_MODULES|CONFIG_UAPI_HEADER_TEST|CONFIG_WERROR|CONFIG_RUST|CONFIG_GCC_PLUGINS|CONFIG_KASAN|CONFIG_KCSAN|CONFIG_KFENCE|CONFIG_KCOV|CONFIG_UBSAN)=' \
          "${OUTPUT_DIR}/.config" \
          2>/dev/null || true

        echo
        echo "Disabled configuration:"

        grep -E \
          '^# CONFIG_(SECURITY_APPARMOR|SECURITY_TOMOYO|SECURITY_SMACK|SECURITY_LOADPIN|SECURITY_LANDLOCK|SECURITY_IPE|SECURITY_SAFESETID|SECURITY_YAMA|SECURITY_LOCKDOWN_LSM|BPF_LSM|UAPI_HEADER_TEST|WERROR|RUST|GCC_PLUGINS|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|KASAN|KCSAN|KFENCE|KCOV|UBSAN) is not set$' \
          "${OUTPUT_DIR}/.config" \
          2>/dev/null || true

        echo
        echo "Kernel release:"

        if [[ -f "${OUTPUT_DIR}/.config" ]]; then
          make \
            -C "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" \
            O="${OUTPUT_DIR}" \
            -s \
            kernelrelease \
            2>/dev/null || true
        fi

    - name: Create auraOS kernel metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"

        RELEASE="$(
          make \
            -C "${SOURCE_DIR}" \
            O="${OUTPUT_DIR}" \
            -s \
            kernelrelease
        )"

        mkdir -p "${PACKAGE_DIR}"

        {
          echo "auraOS kernel"
          echo "Kernel version: ${{ inputs.kernel-version }}"
          echo "Ubuntu source revision: ${{ inputs.kernel-source-revision }}"
          echo "Kernel release: ${RELEASE}"
          echo "Architecture: x86_64"
          echo "Kernel config: ${{ inputs.kernel-config }}"
          echo "AppArmor: disabled"
          echo "UAPI header test: disabled"
          echo "Rust: disabled"
          echo "GCC plugins: disabled"
          echo "WERROR: disabled"
          echo "BTF: disabled"
          echo "KASAN: disabled"
          echo "KCSAN: disabled"
          echo "KFENCE: disabled"
          echo "KCOV: disabled"
          echo "UBSAN: disabled"
          echo "Build user: ${{ inputs.kernel-build-user }}"
          echo "Build host: ${{ inputs.kernel-build-host }}"
          echo "Build version: ${{ inputs.kernel-build-version }}"
          echo "Build timestamp: ${{ inputs.kernel-build-timestamp }}"
          echo "Local version: ${{ inputs.kernel-localversion }}"
          echo "CPU count: $(nproc)"
          echo "Compiler: $(gcc --version | head -n 1)"
          echo "Compiler C++: $(g++ --version | head -n 1)"
          echo "Binutils: $(ld --version | head -n 1)"
          echo "Pahole: $(pahole --version 2>&1 | head -n 1 || true)"
        } > "${PACKAGE_DIR}/auraOS-kernel-info.txt"

        cp \
