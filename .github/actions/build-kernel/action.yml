name: 'Maximize build disk space and build auraOS kernel'
description: 'Maximize build disk space, download Ubuntu Linux 6.8 source, configure a broad x86_64 kernel, build it with diagnostics, and package the result'
branding:
  icon: 'cpu'
  color: 'orange'

inputs:
  root-reserve-mb:
    description: 'Space to leave free on the root filesystem.'
    required: false
    default: '1536'
  temp-reserve-mb:
    description: 'Space to leave free on the temporary filesystem when available.'
    required: false
    default: '512'
  swap-size-mb:
    description: 'Swap space to create.'
    required: false
    default: '4096'
  overprovision-lvm:
    description: 'Use sparse LVM backing files when possible.'
    required: false
    default: 'true'
  build-mount-path:
    description: 'Build filesystem mount path. Defaults to $GITHUB_WORKSPACE.'
    required: false
  build-mount-path-ownership:
    description: 'Ownership for the build mount.'
    required: false
    default: ''
  pv-loop-path:
    description: 'LVM backing file on root filesystem.'
    required: false
    default: '/pv.img'
  tmp-pv-loop-path:
    description: 'LVM backing file on temporary filesystem.'
    required: false
    default: '/mnt/tmp-pv.img'
  remove-dotnet:
    description: 'Remove .NET runtime and libraries.'
    required: false
    default: 'true'
  remove-android:
    description: 'Remove Android SDKs and tools.'
    required: false
    default: 'true'
  remove-haskell:
    description: 'Remove GHC/Haskell artifacts.'
    required: false
    default: 'true'
  remove-codeql:
    description: 'Remove CodeQL bundles.'
    required: false
    default: 'true'
  remove-docker-images:
    description: 'Remove cached Docker images.'
    required: false
    default: 'true'
  kernel-version:
    description: 'Ubuntu kernel source version.'
    required: false
    default: '6.8.0-138'
  kernel-source-revision:
    description: 'Ubuntu source package revision.'
    required: false
    default: '6.8.0-138.138'
  kernel-localversion:
    description: 'Additional local version appended to the kernel release.'
    required: false
    default: '-generic-auraOS'
  kernel-build-user:
    description: 'Kernel build user metadata.'
    required: false
    default: 'aura'
  kernel-build-host:
    description: 'Kernel build host metadata.'
    required: false
    default: 'aura'
  kernel-build-version:
    description: 'Kernel build version metadata.'
    required: false
    default: '1'
  kernel-build-timestamp:
    description: 'Reproducible kernel build timestamp.'
    required: false
    default: '2026-08-20 00:00:00'
  kernel-config:
    description: |
      Kernel configuration mode:
      allmodconfig = maximum practical module coverage,
      allyesconfig = maximum practical built-in coverage,
      allnoconfig = minimal configuration.
    required: false
    default: 'allmodconfig'
  kernel-jobs:
    description: 'Number of parallel kernel build jobs. Defaults to a conservative value based on nproc.'
    required: false
    default: ''
  kernel-verbose:
    description: 'Enable verbose kernel compilation output.'
    required: false
    default: 'true'
  ccache-enabled:
    description: 'Cache compiled objects with ccache across runs to skip rebuilding unchanged files.'
    required: false
    default: 'true'
  ccache-max-size:
    description: 'Maximum size of the ccache cache.'
    required: false
    default: '5G'
  ccache-cache-key-prefix:
    description: 'Prefix for the actions/cache key. Bump this to force a clean cache.'
    required: false
    default: 'auraos-kernel-ccache-v1'

runs:
  using: "composite"
  steps:
    - name: Check runner and initial resources
      shell: bash
      run: |
        set -euo pipefail
        echo "=============================================="
        echo " auraOS kernel build environment"
        echo "=============================================="
        echo
        echo "Runner:"
        uname -a
        echo
        echo "OS:"
        cat /etc/os-release || true
        echo
        echo "Architecture:"
        ARCH="$(uname -m)"
        echo "${ARCH}"
        if [[ "${ARCH}" != "x86_64" ]]; then
          echo "ERROR: This action produces x86_64 artifacts."
          exit 1
        fi
        echo
        echo "CPU:"
        nproc
        echo
        echo "Memory:"
        free -h
        echo
        echo "Swap:"
        swapon --show || true
        echo
        echo "Filesystem:"
        df -hT
        echo
        echo "Inodes:"
        df -ih
        echo
        echo "Temporary directories:"
        ls -ld /tmp /var/tmp 2>/dev/null || true
        ls -ld /mnt 2>/dev/null || true
        echo
        echo "Tool versions:"
        bash --version | head -n 1 || true
        gcc --version | head -n 1 || true
        g++ --version | head -n 1 || true
        make --version | head -n 1 || true
        ld --version | head -n 1 || true
        dpkg --version | head -n 1 || true

    - name: Maximize build disk space
      shell: bash
      run: |
        set -euo pipefail
        BUILD_MOUNT_PATH="${{ inputs.build-mount-path }}"
        if [[ -z "${BUILD_MOUNT_PATH}" ]]; then BUILD_MOUNT_PATH="${GITHUB_WORKSPACE}"; fi
        ACTUAL_OWNER="${{ inputs.build-mount-path-ownership }}"
        if [[ -z "${ACTUAL_OWNER}" ]]; then ACTUAL_OWNER="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"; fi
        ROOT_RESERVE_MB="${{ inputs.root-reserve-mb }}"
        TEMP_RESERVE_MB="${{ inputs.temp-reserve-mb }}"
        SWAP_SIZE_MB="${{ inputs.swap-size-mb }}"
        for item in ROOT_RESERVE_MB TEMP_RESERVE_MB SWAP_SIZE_MB; do
          if ! [[ "${!item}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: ${item,,} must be numeric."
            exit 1
          fi
        done
        echo "Build mount:  ${BUILD_MOUNT_PATH}"
        echo "Mount owner:  ${ACTUAL_OWNER}"
        echo "Root reserve: ${ROOT_RESERVE_MB} MiB"
        echo "Temp reserve: ${TEMP_RESERVE_MB} MiB"
        echo "Swap:         ${SWAP_SIZE_MB} MiB"
        echo
        echo "Removing unnecessary preinstalled software..."
        if [[ "${{ inputs.remove-dotnet }}" == "true" ]]; then sudo rm -rf /usr/share/dotnet; fi
        if [[ "${{ inputs.remove-android }}" == "true" ]]; then sudo rm -rf /usr/local/lib/android; fi
        if [[ "${{ inputs.remove-haskell }}" == "true" ]]; then sudo rm -rf /opt/ghc; fi
        if [[ "${{ inputs.remove-codeql }}" == "true" ]]; then sudo rm -rf /opt/hostedtoolcache/CodeQL; fi
        if [[ "${{ inputs.remove-docker-images }}" == "true" ]] && command -v docker >/dev/null 2>&1; then sudo docker system prune -af --volumes || true; fi
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        echo
        echo "Removing existing swap..."
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile /swapfile
        VG_NAME="buildvg"
        ROOT_LOOP_DEV=""
        TMP_LOOP_DEV=""
        sudo mkdir -p "${BUILD_MOUNT_PATH}"
        if sudo vgs "${VG_NAME}" >/dev/null 2>&1; then
          echo "ERROR: Volume group ${VG_NAME} already exists."
          sudo vgdisplay "${VG_NAME}" || true
          exit 1
        fi
        ROOT_FREE_KB="$(df --block-size=1024 --output=avail / | tail -n 1 | tr -d '[:space:]')"
        ROOT_RESERVE_KB="$((ROOT_RESERVE_MB * 1024))"
        MIN_LVM_KB="$((4 * 1024 * 1024))"
        if (( ROOT_FREE_KB <= ROOT_RESERVE_KB + MIN_LVM_KB )); then
          echo "WARNING: insufficient root free space for an LVM build volume."
          echo "Continuing with the original workspace filesystem."
          exit 0
        fi
        ROOT_LVM_SIZE_KB="$((ROOT_FREE_KB - ROOT_RESERVE_KB))"
        ROOT_LVM_SIZE_BYTES="$((ROOT_LVM_SIZE_KB * 1024))"
        echo
        echo "Root free before LVM: ${ROOT_FREE_KB} KiB"
        echo "Root LVM size:       ${ROOT_LVM_SIZE_KB} KiB"
        sudo rm -f "${{ inputs.pv-loop-path }}"
        sudo touch "${{ inputs.pv-loop-path }}"
        if [[ "${{ inputs.overprovision-lvm }}" == "true" ]]; then sudo truncate -s "${ROOT_LVM_SIZE_BYTES}" "${{ inputs.pv-loop-path }}"; else sudo fallocate -l "${ROOT_LVM_SIZE_BYTES}" "${{ inputs.pv-loop-path }}"; fi
        ROOT_LOOP_DEV="$(sudo losetup --find --show "${{ inputs.pv-loop-path }}")"
        echo "Root loop device: ${ROOT_LOOP_DEV}"
        sudo pvcreate -ff -y "${ROOT_LOOP_DEV}"
        PV_DEVICES=("${ROOT_LOOP_DEV}")
        if mountpoint -q /mnt 2>/dev/null; then
          TMP_FREE_KB="$(df --block-size=1024 --output=avail /mnt | tail -n 1 | tr -d '[:space:]')"
          TEMP_RESERVE_KB="$((TEMP_RESERVE_MB * 1024))"
          if (( TMP_FREE_KB > TEMP_RESERVE_KB + MIN_LVM_KB )); then
            TMP_LVM_SIZE_KB="$((TMP_FREE_KB - TEMP_RESERVE_KB))"
            TMP_LVM_SIZE_BYTES="$((TMP_LVM_SIZE_KB * 1024))"
            echo
            echo "Temp free before LVM: ${TMP_FREE_KB} KiB"
            echo "Temp LVM size:       ${TMP_LVM_SIZE_KB} KiB"
            sudo mkdir -p "$(dirname "${{ inputs.tmp-pv-loop-path }}")"
            sudo rm -f "${{ inputs.tmp-pv-loop-path }}"
            sudo touch "${{ inputs.tmp-pv-loop-path }}"
            if [[ "${{ inputs.overprovision-lvm }}" == "true" ]]; then sudo truncate -s "${TMP_LVM_SIZE_BYTES}" "${{ inputs.tmp-pv-loop-path }}"; else sudo fallocate -l "${TMP_LVM_SIZE_BYTES}" "${{ inputs.tmp-pv-loop-path }}"; fi
            TMP_LOOP_DEV="$(sudo losetup --find --show "${{ inputs.tmp-pv-loop-path }}")"
            echo "Temp loop device: ${TMP_LOOP_DEV}"
            sudo pvcreate -ff -y "${TMP_LOOP_DEV}"
            PV_DEVICES+=("${TMP_LOOP_DEV}")
          else
            echo "Not enough free space on /mnt; using root PV only."
          fi
        else
          echo "/mnt is not a separate mounted filesystem; using root PV only."
        fi
        echo
        echo "Creating volume group..."
        sudo vgcreate "${VG_NAME}" "${PV_DEVICES[@]}"
        echo
        echo "Creating swap LV..."
        sudo lvcreate -L "${SWAP_SIZE_MB}M" -n swap "${VG_NAME}"
        sudo mkswap "/dev/${VG_NAME}/swap"
        sudo swapon "/dev/${VG_NAME}/swap"
        echo
        echo "Creating build LV..."
        sudo lvcreate -l 100%FREE -n buildlv "${VG_NAME}"
        sudo mkfs.ext4 -m 0 -E lazy_itable_init=1,lazy_journal_init=1 "/dev/${VG_NAME}/buildlv"
        sudo mount "/dev/${VG_NAME}/buildlv" "${BUILD_MOUNT_PATH}"
        sudo chown "${ACTUAL_OWNER}" "${BUILD_MOUNT_PATH}"
        echo
        echo "Build filesystem:"
        df -hT "${BUILD_MOUNT_PATH}"
        echo
        echo "Build filesystem inodes:"
        df -ih "${BUILD_MOUNT_PATH}"
        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true
        echo
        echo "Swap:"
        swapon --show || true

    - name: Install kernel build dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential gcc g++ gcc-multilib g++-multilib libc6-dev libc6-dev-i386 \
          bc bison flex libssl-dev libelf-dev libdw-dev dwarves pkg-config cpio rsync kmod \
          fakeroot dpkg-dev debhelper libncurses-dev libcap-dev libcap-ng-dev libaudit-dev \
          git curl ca-certificates xz-utils zstd bzip2 gzip openssl initramfs-tools lz4 xorriso \
          dosfstools e2fsprogs file tar perl python3 python3-minimal ccache
        echo
        echo "Toolchain:"
        gcc --version | head -n 1
        g++ --version | head -n 1
        make --version | head -n 1
        ld --version | head -n 1
        pahole --version || true
        openssl version
        ccache --version | head -n 1 || true
        echo
        echo "Compiler multilib test:"
        printf 'int main(void) { return 0; }\n' > /tmp/aura-test.c
        gcc -m32 /tmp/aura-test.c -o /tmp/aura-test32
        gcc -m64 /tmp/aura-test.c -o /tmp/aura-test64
        file /tmp/aura-test32
        file /tmp/aura-test64
        rm -f /tmp/aura-test.c /tmp/aura-test32 /tmp/aura-test64
        echo
        echo "Required binaries:"
        for tool in gcc g++ make ld as ar nm objcopy strip bc flex bison perl rsync depmod mkinitramfs dpkg-deb curl tar zstd lz4 python3; do
          if ! command -v "${tool}" >/dev/null 2>&1; then
            echo "ERROR: Required tool not found: ${tool}"
            exit 1
          fi
        done
        test -f /usr/include/openssl/ssl.h
        test -f /usr/include/elf.h
        test -f /usr/include/ncurses.h
        echo
        echo "Build dependencies check passed."

    - name: Restore ccache
      if: ${{ inputs.ccache-enabled == 'true' }}
      id: ccache-restore
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: >-
          ${{ inputs.ccache-cache-key-prefix }}-${{ inputs.kernel-version }}-${{ inputs.kernel-source-revision }}-${{ inputs.kernel-config }}-${{ inputs.kernel-localversion }}-${{ hashFiles(format('{0}/action.yml', github.action_path)) }}-${{ github.run_id }}
        restore-keys: |
          ${{ inputs.ccache-cache-key-prefix }}-${{ inputs.kernel-version }}-${{ inputs.kernel-source-revision }}-${{ inputs.kernel-config }}-${{ inputs.kernel-localversion }}-${{ hashFiles(format('{0}/action.yml', github.action_path)) }}-
          ${{ inputs.ccache-cache-key-prefix }}-${{ inputs.kernel-version }}-${{ inputs.kernel-source-revision }}-${{ inputs.kernel-config }}-${{ inputs.kernel-localversion }}-
          ${{ inputs.ccache-cache-key-prefix }}-${{ inputs.kernel-version }}-${{ inputs.kernel-source-revision }}-

    - name: Configure ccache
      if: ${{ inputs.ccache-enabled == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
        mkdir -p "${CCACHE_DIR}"
        echo "CCACHE_DIR=${CCACHE_DIR}" >> "${GITHUB_ENV}"
        ccache --max-size="${{ inputs.ccache-max-size }}" --set-config=cache_dir="${CCACHE_DIR}"
        # compiler_check=content makes ccache hash actual compiler bytes
        # instead of trusting mtime, which is safer given this action
        # patches kernel source files in place between cache hits.
        ccache --set-config=compiler_check=content
        ccache --zero-stats
        echo
        echo "ccache configuration:"
        ccache --show-config | grep -E 'cache_dir |max_size |compiler_check '
        echo
        echo "Cache restored: ${{ steps.ccache-restore.outputs.cache-hit == 'true' && 'exact hit' || 'no exact hit (used restore-keys fallback or empty)' }}"

    - name: Download Ubuntu Linux source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        SOURCE_DEB="${BUILD_ROOT}/linux-source-${{ inputs.kernel-version }}_${{ inputs.kernel-source-revision }}_all.deb"
        mkdir -p "${BUILD_ROOT}"
        URLS=(
          "https://ppa.launchpadcontent.net/canonical-kernel-team/ppa2/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://archive.ubuntu.com/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://security.ubuntu.com/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
          "https://ftp.rz.uni-wuerzburg.de/ubuntu/pool/main/l/linux/linux-source-6.8.0_${{ inputs.kernel-source-revision }}_all.deb"
        )
        downloaded="false"
        for url in "${URLS[@]}"; do
          echo
          echo "Trying:"
          echo "  ${url}"
          rm -f "${SOURCE_DEB}.part"
          if curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 1200 -o "${SOURCE_DEB}.part" "${url}"; then
            if [[ -s "${SOURCE_DEB}.part" ]]; then
              mv "${SOURCE_DEB}.part" "${SOURCE_DEB}"
              downloaded="true"
              break
            fi
            rm -f "${SOURCE_DEB}.part"
          fi
        done
        if [[ "${downloaded}" != "true" ]]; then
          echo
          echo "ERROR: Failed to download Ubuntu Linux source."
          exit 1
        fi
        echo
        echo "Downloaded source package:"
        ls -lh "${SOURCE_DEB}"
        echo
        echo "Checking Debian package:"
        dpkg-deb --info "${SOURCE_DEB}" | head -100
        echo
        echo "Checking package contents:"
        if ! dpkg-deb --contents "${SOURCE_DEB}" | grep -E 'linux-source-6\.8\.0\.tar\.(bz2|xz|zst)$' | head -20; then
          echo "ERROR: Expected Linux 6.8 source archive was not found in the package."
          exit 1
        fi
        echo
        echo "Extracting source package..."
        rm -rf "${BUILD_ROOT}/source-package" "${SOURCE_DIR}"
        mkdir -p "${BUILD_ROOT}/source-package" "${SOURCE_DIR}"
        dpkg-deb -x "${SOURCE_DEB}" "${BUILD_ROOT}/source-package"
        SOURCE_TARBALL="$(find "${BUILD_ROOT}/source-package" -type f \( -name "linux-source-6.8.0.tar.bz2" -o -name "linux-source-6.8.0.tar.xz" -o -name "linux-source-6.8.0.tar.zst" \) | head -n 1)"
        if [[ -z "${SOURCE_TARBALL}" ]]; then
          echo "ERROR: Kernel source archive not found."
          find "${BUILD_ROOT}/source-package" -type f | head -100
          exit 1
        fi
        case "${SOURCE_TARBALL}" in
          *.tar.bz2) tar -xjf "${SOURCE_TARBALL}" --strip-components=1 -C "${SOURCE_DIR}" ;;
          *.tar.xz) tar -xJf "${SOURCE_TARBALL}" --strip-components=1 -C "${SOURCE_DIR}" ;;
          *.tar.zst) tar --zstd -xf "${SOURCE_TARBALL}" --strip-components=1 -C "${SOURCE_DIR}" ;;
          *) echo "ERROR: Unsupported archive: ${SOURCE_TARBALL}"; exit 1 ;;
        esac
        test -f "${SOURCE_DIR}/Makefile"
        test -f "${SOURCE_DIR}/Kconfig"
        test -d "${SOURCE_DIR}/drivers"
        test -d "${SOURCE_DIR}/kernel"
        test -d "${SOURCE_DIR}/security"
        echo
        echo "Source directory:"
        echo "  ${SOURCE_DIR}"
        echo
        echo "Kernel version reported by source:"
        make -C "${SOURCE_DIR}" kernelversion
        ACTUAL_BASE_VERSION="$(make -C "${SOURCE_DIR}" -s kernelversion)"
        case "${ACTUAL_BASE_VERSION}" in
          6.8.*) ;;
          *) echo "ERROR: Expected Linux 6.8 source, got: ${ACTUAL_BASE_VERSION}"; exit 1 ;;
        esac

    - name: Check known Ubuntu AppArmor build issue
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        cd "${SOURCE_DIR}"
        echo "Checking AppArmor source for the known incompatible symbol..."
        if grep -R -n --include='*.c' 'spin_is_lock' security/apparmor 2>/dev/null; then
          echo
          echo "AppArmor contains spin_is_lock()."
          echo "CONFIG_SECURITY_APPARMOR will be forced to n."
        fi
        echo
        echo "RCU list API references:"
        grep -n 'list_for_each_entry_rcu' include/linux/rculist.h | head -10 || true

    - name: Fix known Ubuntu cifs/smbdirect.c build issue
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        SMBDIRECT="${SOURCE_DIR}/fs/smb/client/smbdirect.c"
        cd "${SOURCE_DIR}"
        echo "Checking cifs/smbdirect.c for known Ubuntu 6.8.0-138 backport breakage..."
        test -f "${SMBDIRECT}"

        PATCHED=0

        # 1) smbd_post_send_iter() references an undeclared 'sp' pointer.
        #    Upstream later introduced a "peer socket parameters" struct
        #    (smbdirect_socket_parameters, accessed as sc->parameters via a
        #    local 'sp' shortcut) as part of a much larger 2026 smbdirect
        #    refactor ("smb: common: introduce and use common smbdirect
        #    headers/structures"), and a follow-up commit ("smb: client: let
        #    smbd_post_send_iter() respect the peers max_send_size and
        #    transmit all data") switched this one line to use it.
        #    That struct/field does NOT exist anywhere in this 6.8.0-138.138
        #    tree (confirmed: fs/smb/common/smbdirect/smbdirect_socket.h here
        #    has no "parameters" member at all), so Ubuntu's backport of that
        #    later commit is incomplete/inapplicable to this kernel version.
        #    In this tree the negotiated send size is simply
        #    smbd_connection::max_send_size (i.e. 'info->max_send_size'),
        #    which is exactly what every other line in this function already
        #    uses. Realigning this line to match fixes:
        #      error: 'sp' undeclared (first use in this function)
        if grep -q 'sp->max_send_size - sizeof(\*packet));' "${SMBDIRECT}"; then
          echo "Patching: sp->max_send_size -> info->max_send_size"
          sed -i 's/sp->max_send_size - sizeof(\*packet));/info->max_send_size - sizeof(*packet));/' "${SMBDIRECT}"
          PATCHED=1
        fi

        # 2) smbd_destroy() calls disable_work_sync(), which was added to the
        #    kernel workqueue API by Tejun Heo's "workqueue: Implement
        #    disable/enable_work()" series, merged for v6.10 (2024) - i.e.
        #    strictly newer than this 6.8.0 tree, whose
        #    include/linux/workqueue.h only declares cancel_work_sync()
        #    (confirmed by grep against the actual downloaded source).
        #    cancel_work_sync() is already used elsewhere in this same file
        #    for the equivalent teardown purpose, so use it here too. Fixes:
        #      error: implicit declaration of function 'disable_work_sync'
        if grep -q 'disable_work_sync(&info->post_send_credits_work);' "${SMBDIRECT}"; then
          echo "Patching: disable_work_sync() -> cancel_work_sync()"
          sed -i 's/disable_work_sync(&info->post_send_credits_work);/cancel_work_sync(\&info->post_send_credits_work);/' "${SMBDIRECT}"
          PATCHED=1
        fi

        if [[ "${PATCHED}" -eq 1 ]]; then
          echo
          echo "Verifying patch applied cleanly:"
          grep -n 'info->max_send_size - sizeof(\*packet));' "${SMBDIRECT}"
          grep -n 'cancel_work_sync(&info->post_send_credits_work);' "${SMBDIRECT}"
          if grep -q '\bsp->max_send_size\b' "${SMBDIRECT}"; then
            echo "ERROR: stray 'sp->max_send_size' reference remains after patching."
            exit 1
          fi
          if grep -q 'disable_work_sync(' "${SMBDIRECT}"; then
            echo "ERROR: stray 'disable_work_sync(' reference remains after patching."
            exit 1
          fi
          echo
          echo "cifs/smbdirect.c patched successfully."
        else
          echo "No known-broken pattern found; source may already be fixed upstream. Skipping patch."
        fi

    - name: Fix known Ubuntu xfs/scrub build issue (missing xchk_da_set_preen)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        SCRUB_DIR="${SOURCE_DIR}/fs/xfs/scrub"
        DABTREE_C="${SCRUB_DIR}/dabtree.c"
        DABTREE_H="${SCRUB_DIR}/dabtree.h"
        TRACE_H="${SCRUB_DIR}/trace.h"
        ATTR_C="${SCRUB_DIR}/attr.c"
        cd "${SOURCE_DIR}"
        echo "Checking xfs/scrub for known missing xchk_da_set_preen() helper..."
        test -f "${DABTREE_C}"
        test -f "${DABTREE_H}"
        test -f "${TRACE_H}"
        test -f "${ATTR_C}"

        PATCHED=0

        # fs/xfs/scrub/attr.c calls xchk_da_set_preen(ds, level) to mark
        # zero-length/nonzero-base freemap entries for preening, but this
        # Ubuntu 6.8.0-138.138 tree never got the companion helper added to
        # dabtree.c/.h (nor the matching xchk_fblock_preen tracepoint in
        # trace.h) even though the call site in attr.c is present - another
        # incomplete backport, same class of issue as the smbdirect.c fixes
        # above. The sibling helpers xchk_block_set_preen()/xchk_ino_set_preen()
        # already exist in common.c, and xchk_da_set_corrupt() in dabtree.c is
        # the direct structural analog (same signature, same call sites) for
        # the OFLAG_CORRUPT case, so we add xchk_da_set_preen() modeled
        # exactly on it, plus the matching declaration and tracepoint. Fixes:
        #   error: implicit declaration of function 'xchk_da_set_preen'
        if grep -q 'xchk_da_set_preen(ds, level);' "${ATTR_C}" \
            && ! grep -q 'xchk_da_set_preen' "${DABTREE_H}"; then

          echo "Adding trace_xchk_fblock_preen tracepoint to trace.h"
          if ! grep -q 'DEFINE_SCRUB_FBLOCK_ERROR_EVENT(xchk_fblock_preen);' "${TRACE_H}"; then
            sed -i '/DEFINE_SCRUB_FBLOCK_ERROR_EVENT(xchk_fblock_warning);/a DEFINE_SCRUB_FBLOCK_ERROR_EVENT(xchk_fblock_preen);' "${TRACE_H}"
          fi

          echo "Declaring xchk_da_set_preen() in dabtree.h"
          sed -i '/^void xchk_da_set_corrupt(struct xchk_da_btree \*ds, int level);$/a void xchk_da_set_preen(struct xchk_da_btree *ds, int level);' "${DABTREE_H}"

          echo "Implementing xchk_da_set_preen() in dabtree.c"
          if grep -q '^xchk_da_set_preen($' "${DABTREE_C}"; then
            echo "xchk_da_set_preen() already present in dabtree.c; skipping insertion."
          else
            NEWFUNC=$'\n/*\n * Record da btree metadata that could be optimized. See the section\n * about handling optimizable metadata in common.c.\n */\nvoid\nxchk_da_set_preen(\n\tstruct xchk_da_btree\t*ds,\n\tint\t\t\tlevel)\n{\n\tstruct xfs_scrub\t*sc = ds->sc;\n\n\tsc->sm->sm_flags |= XFS_SCRUB_OFLAG_PREEN;\n\n\ttrace_xchk_fblock_preen(sc, ds->dargs.whichfork,\n\t\t\txfs_dir2_da_to_db(ds->dargs.geo,\n\t\t\t\tds->state->path.blk[level].blkno),\n\t\t\t__return_address);\n}'
            awk -v newfunc="${NEWFUNC}" '
              { print }
              /^xchk_da_set_corrupt\($/ { infunc=1 }
              infunc && /^}$/ { print newfunc; infunc=0 }
            ' "${DABTREE_C}" > "${DABTREE_C}.tmp" && mv "${DABTREE_C}.tmp" "${DABTREE_C}"
            echo "xchk_da_set_preen() inserted into dabtree.c"
          fi

          PATCHED=1
        fi

        if [[ "${PATCHED}" -eq 1 ]]; then
          echo
          echo "Verifying patch applied cleanly:"
          grep -n 'DEFINE_SCRUB_FBLOCK_ERROR_EVENT(xchk_fblock_preen);' "${TRACE_H}"
          grep -n 'void xchk_da_set_preen(struct xchk_da_btree \*ds, int level);' "${DABTREE_H}"
          grep -n '^xchk_da_set_preen($' "${DABTREE_C}"
          echo
          echo "xfs/scrub xchk_da_set_preen() helper added successfully."
        else
          echo "No known-broken pattern found; source may already be fixed upstream. Skipping patch."
        fi

    - name: Fix known Ubuntu xfs/scrub build issue (missing xfs_attr.h include in repair.c)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        REPAIR_C="${SOURCE_DIR}/fs/xfs/scrub/repair.c"
        cd "${SOURCE_DIR}"
        echo "Checking fs/xfs/scrub/repair.c for missing xfs_attr.h include..."
        test -f "${REPAIR_C}"

        PATCHED=0

        # fs/xfs/scrub/repair.c calls xfs_inode_hasattr(sc->ip), which is a
        # real, correctly-declared function (fs/xfs/libxfs/xfs_attr.h,
        # implemented in libxfs/xfs_attr.c) already used successfully
        # elsewhere in this same tree (scrub/common.c, scrub/attr.c,
        # xfs_attr_list.c, xfs_attr_item.c) -- every one of those files
        # includes "xfs_attr.h", but repair.c simply never gained that
        # #include, even though it has the call site. Same class of
        # incomplete-backport issue as the other known fixes above, just a
        # missing header instead of a missing symbol. Fixes:
        #   error: implicit declaration of function 'xfs_inode_hasattr'
        #
        # xfs_attr.h only forward-declares "struct xfs_da_args;" -- it does
        # NOT define it. Several of its static inline helpers (e.g.
        # xfs_attr_init_add_state()/xfs_attr_init_remove_state()) dereference
        # args->dp and args->op_flags, which requires the full definition of
        # struct xfs_da_args. That full struct definition lives in
        # xfs_da_btree.h (which itself needs xfs_da_format.h). Every other
        # file that includes xfs_attr.h successfully (e.g. scrub/attr.c)
        # always includes "xfs_da_format.h" and "xfs_da_btree.h" first.
        # repair.c had neither, so adding xfs_attr.h alone left struct
        # xfs_da_args incomplete at that point in the file, producing:
        #   error: invalid use of undefined type 'struct xfs_da_args'
        #   error: 'XFS_DA_OP_ADDNAME' undeclared (first use in this function)
        # Adding the two prerequisite headers alongside xfs_attr.h fixes it.
        if grep -q 'xfs_inode_hasattr(sc->ip)' "${REPAIR_C}" \
            && ! grep -q '^#include "xfs_attr.h"$' "${REPAIR_C}"; then
          echo "Adding #include \"xfs_da_format.h\", \"xfs_da_btree.h\" and \"xfs_attr.h\" to repair.c"
          sed -i '/^#include "xfs_reflink.h"$/i #include "xfs_da_format.h"\n#include "xfs_da_btree.h"\n#include "xfs_attr.h"' "${REPAIR_C}"
          PATCHED=1
        fi

        if [[ "${PATCHED}" -eq 1 ]]; then
          echo
          echo "Verifying patch applied cleanly:"
          grep -n '^#include "xfs_da_format.h"$' "${REPAIR_C}"
          grep -n '^#include "xfs_da_btree.h"$' "${REPAIR_C}"
          grep -n '^#include "xfs_attr.h"$' "${REPAIR_C}"
          echo
          echo "xfs/scrub repair.c include fix applied successfully."
        else
          echo "No known-broken pattern found; source may already be fixed upstream. Skipping patch."
        fi

    - name: Fix known Ubuntu regmap KUnit backport build issue
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        REGMAP_KUNIT="${SOURCE_DIR}/drivers/base/regmap/regmap-kunit.c"
        cd "${SOURCE_DIR}"
        echo "Checking drivers/base/regmap/regmap-kunit.c for incomplete KUnit backport..."
        test -f "${REGMAP_KUNIT}"

        PATCHED=0

        # Ubuntu's 6.8.0-138 tree can contain the newer gen_raw_regmap()
        # implementation body, which uses the KUnit test object, without
        # the corresponding struct kunit *test parameter and caller updates.
        # The resulting build failure is:
        #   error: 'test' undeclared (first use in this function)
        # Upstream's fixed form passes struct kunit *test explicitly from
        # every caller. In this Ubuntu tree gen_raw_regmap() still has the
        # older raw_test_types *test_type argument, so retain that argument
        # and add only the missing KUnit test parameter.
        if grep -q '^static struct regmap \*gen_raw_regmap(struct regmap_config \*config,$' "${REGMAP_KUNIT}" \
            && grep -q 'kunit_kcalloc(test,' "${REGMAP_KUNIT}"; then
          echo "Patching gen_raw_regmap() to receive struct kunit *test"
          sed -i \
            's/^static struct regmap \*gen_raw_regmap(struct regmap_config \*config,$/static struct regmap *gen_raw_regmap(struct kunit *test,\n\tstruct regmap_config *config,/' \
            "${REGMAP_KUNIT}"

          # This source revision still calls the helper as:
          #   gen_raw_regmap(&config, t, &data)
          # Add test to every such caller. Do not match the function
          # declaration because it does not contain &config.
          BEFORE_CALLS="$(grep -Ec 'gen_raw_regmap\(&config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${BEFORE_CALLS}" -eq 0 ]]; then
            echo "ERROR: expected gen_raw_regmap(&config, ...) callers were not found."
            exit 1
          fi
          sed -i 's/gen_raw_regmap(&config,/gen_raw_regmap(test, \&config,/g' "${REGMAP_KUNIT}"
          PATCHED=1
        fi

        if [[ "${PATCHED}" -eq 1 ]]; then
          echo
          echo "Verifying regmap KUnit patch:"
          grep -n -A3 '^static struct regmap \*gen_raw_regmap' "${REGMAP_KUNIT}"

          # The helper must have the new test parameter while retaining the
          # existing raw_test_types parameter.
          if ! grep -q '^static struct regmap \*gen_raw_regmap(struct kunit \*test,$' "${REGMAP_KUNIT}"; then
            echo "ERROR: gen_raw_regmap() signature was not patched correctly."
            exit 1
          fi
          if ! grep -q 'struct raw_test_types \*test_type,' "${REGMAP_KUNIT}"; then
            echo "ERROR: existing raw_test_types parameter was unexpectedly lost."
            exit 1
          fi

          REMAINING="$(grep -Ec 'gen_raw_regmap\(&config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${REMAINING}" -ne 0 ]]; then
            echo "ERROR: ${REMAINING} unpatched gen_raw_regmap() caller(s) remain."
            grep -n 'gen_raw_regmap(' "${REGMAP_KUNIT}"
            exit 1
          fi

          PATCHED_CALLS="$(grep -Ec 'gen_raw_regmap\(test, &config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${PATCHED_CALLS}" -eq 0 ]]; then
            echo "ERROR: no patched gen_raw_regmap() callers found."
            exit 1
          fi

          echo "Patched ${PATCHED_CALLS} gen_raw_regmap() caller(s)."
          echo "regmap KUnit backport fix applied successfully."
        else
          echo "No known-broken regmap KUnit pattern found; source may already be fixed upstream."
        fi

    - name: Fix known Ubuntu regmap KUnit backport build issue (gen_regmap)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        REGMAP_KUNIT="${SOURCE_DIR}/drivers/base/regmap/regmap-kunit.c"
        cd "${SOURCE_DIR}"
        echo "Checking drivers/base/regmap/regmap-kunit.c for incomplete gen_regmap() KUnit backport..."
        test -f "${REGMAP_KUNIT}"

        PATCHED=0

        # This file has two near-identical helpers: gen_raw_regmap() (fixed
        # by the previous step) and the older, much more widely used
        # gen_regmap() (~19 call sites). Both suffer from the exact same
        # incomplete backport: the body of gen_regmap() references the
        # KUnit test object via kunit_kcalloc(test, ...), but the function
        # signature was never updated to take struct kunit *test, and none
        # of its callers (all of which are KUnit test cases of the form
        # "static void foo(struct kunit *test)", so `test` is always in
        # scope at the call site) pass it in. Confirmed against the actual
        # downloaded source: gen_raw_regmap() already had a test_type
        # parameter to piggyback the fix onto, but gen_regmap() has no such
        # parameter at all, so this second, distinct instance of the bug
        # was missed by the previous step. Build failure:
        #   error: 'test' undeclared (first use in this function)
        if grep -q '^static struct regmap \*gen_regmap(struct regmap_config \*config,$' "${REGMAP_KUNIT}" \
            && grep -q 'kunit_kcalloc(test,' "${REGMAP_KUNIT}"; then
          echo "Patching gen_regmap() to receive struct kunit *test"
          sed -i \
            's/^static struct regmap \*gen_regmap(struct regmap_config \*config,$/static struct regmap *gen_regmap(struct kunit *test,\n\tstruct regmap_config *config,/' \
            "${REGMAP_KUNIT}"

          # Every caller currently reads "gen_regmap(&config, &data)". Add
          # test to each one. The (already-patched) gen_raw_regmap() callers
          # use a distinct "gen_raw_regmap(test, &config, ..." spelling, so
          # this plain substring match cannot collide with them.
          BEFORE_CALLS="$(grep -Ec 'gen_regmap\(&config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${BEFORE_CALLS}" -eq 0 ]]; then
            echo "ERROR: expected gen_regmap(&config, ...) callers were not found."
            exit 1
          fi
          sed -i 's/gen_regmap(&config,/gen_regmap(test, \&config,/g' "${REGMAP_KUNIT}"
          PATCHED=1
        fi

        if [[ "${PATCHED}" -eq 1 ]]; then
          echo
          echo "Verifying regmap KUnit gen_regmap() patch:"
          grep -n -A2 '^static struct regmap \*gen_regmap' "${REGMAP_KUNIT}"

          if ! grep -q '^static struct regmap \*gen_regmap(struct kunit \*test,$' "${REGMAP_KUNIT}"; then
            echo "ERROR: gen_regmap() signature was not patched correctly."
            exit 1
          fi

          REMAINING="$(grep -Ec 'gen_regmap\(&config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${REMAINING}" -ne 0 ]]; then
            echo "ERROR: ${REMAINING} unpatched gen_regmap() caller(s) remain."
            grep -n 'gen_regmap(' "${REGMAP_KUNIT}"
            exit 1
          fi

          PATCHED_CALLS="$(grep -Ec 'gen_regmap\(test, &config,' "${REGMAP_KUNIT}" || true)"
          if [[ "${PATCHED_CALLS}" -eq 0 ]]; then
            echo "ERROR: no patched gen_regmap() callers found."
            exit 1
          fi

          echo "Patched ${PATCHED_CALLS} gen_regmap() caller(s)."
          echo "regmap KUnit gen_regmap() backport fix applied successfully."
        else
          echo "No known-broken gen_regmap() pattern found; source may already be fixed upstream."
        fi

