    - name: Force CONFIG_PAGE_EXTENSION=n through Kconfig select chains
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        CONFIG_FILE="${OUTPUT_DIR}/.config"
        SCRIPTS_CONFIG="${SOURCE_DIR}/scripts/config"
        MAX_PASSES=5
        cd "${SOURCE_DIR}"

        test -x "${SCRIPTS_CONFIG}" || test -f "${SCRIPTS_CONFIG}"
        test -f "${CONFIG_FILE}"

        echo "=============================================="
        echo " Enforcing CONFIG_PAGE_EXTENSION=n"
        echo "=============================================="

        # Build a reverse select graph from every Kconfig file:
        #   target <- selector
        # A pass expands one dependency level, then olddefconfig resolves
        # selects again. This handles chains such as A -> B -> PAGE_EXTENSION.
        GRAPH_FILE="${OUTPUT_DIR}/page-extension-select-graph.tsv"
        DIRECT_FILE="${OUTPUT_DIR}/page-extension-direct-selectors.txt"

        python3 - "${SOURCE_DIR}" "${GRAPH_FILE}" "${DIRECT_FILE}" <<'PY'
        import pathlib
        import re
        import sys

        source = pathlib.Path(sys.argv[1])
        graph_out = pathlib.Path(sys.argv[2])
        direct_out = pathlib.Path(sys.argv[3])

        config_re = re.compile(r'^\s*(?:menuconfig|config)\s+([A-Za-z0-9_]+)\b')
        select_re = re.compile(r'^\s*select\s+([A-Za-z0-9_]+)\b')

        edges = set()
        for path in source.rglob('Kconfig*'):
            if not path.is_file() or path.is_symlink():
                continue
            try:
                lines = path.read_text(encoding='utf-8', errors='ignore').splitlines()
            except OSError:
                continue
            current = None
            for line in lines:
                match = config_re.match(line)
                if match:
                    current = match.group(1)
                    continue
                match = select_re.match(line)
                if match and current:
                    target = match.group(1)
                    edges.add((target, current))

        with graph_out.open('w', encoding='utf-8') as f:
            for target, selector in sorted(edges):
                f.write(f'{target}\t{selector}\n')

        with direct_out.open('w', encoding='utf-8') as f:
            for target, selector in sorted(edges):
                if target == 'PAGE_EXTENSION':
                    f.write(f'{selector}\n')
        PY

        echo
        echo "Symbols that directly select PAGE_EXTENSION:"
        if [[ -s "${DIRECT_FILE}" ]]; then
          sed 's/^/  /' "${DIRECT_FILE}"
        else
          echo "  <none found>"
        fi

        if grep -Eq '^CONFIG_PAGE_EXTENSION=([ym])$' "${CONFIG_FILE}"; then
          echo "CONFIG_PAGE_EXTENSION is currently enabled; dependency fixpoint is required."
        fi

        target_file="${OUTPUT_DIR}/page-extension-targets.txt"
        next_target_file="${OUTPUT_DIR}/page-extension-next-targets.txt"
        disable_file="${OUTPUT_DIR}/page-extension-disable.txt"
        printf '%s\n' PAGE_EXTENSION > "${target_file}"

        cfg_is_enabled() {
          local symbol="$1"
          grep -Eq "^CONFIG_${symbol}=([ym])$" "${CONFIG_FILE}"
        }

        page_extension_is_disabled() {
          grep -Eq '^# CONFIG_PAGE_EXTENSION is not set$' "${CONFIG_FILE}"
        }

        for pass in $(seq 1 "${MAX_PASSES}"); do
          echo
          echo "--- PAGE_EXTENSION dependency pass ${pass}/${MAX_PASSES} ---"
          : > "${next_target_file}"
          : > "${disable_file}"

          while IFS=$'\t' read -r target selector; do
            [[ -n "${target}" && -n "${selector}" ]] || continue
            if grep -qxF "${target}" "${target_file}"; then
              printf '%s\n' "${selector}" >> "${next_target_file}"
            fi
          done < "${GRAPH_FILE}"

          sort -u "${next_target_file}" -o "${next_target_file}"

          if [[ -s "${next_target_file}" ]]; then
            echo "Selectors discovered from the current target set:"
            sed 's/^/  /' "${next_target_file}"
          else
            echo "No further selector dependencies discovered."
          fi

          while IFS= read -r selector; do
            [[ -n "${selector}" ]] || continue
            [[ "${selector}" != "PAGE_EXTENSION" ]] || continue
            if cfg_is_enabled "${selector}"; then
              printf '%s\n' "${selector}" >> "${disable_file}"
            fi
          done < "${next_target_file}"

          sort -u "${disable_file}" -o "${disable_file}"

          if [[ -s "${disable_file}" ]]; then
            echo "Disabling currently enabled selectors:"
            sed 's/^/  /' "${disable_file}"
            while IFS= read -r selector; do
              [[ -n "${selector}" ]] || continue
              "${SCRIPTS_CONFIG}" --file "${CONFIG_FILE}" --disable "CONFIG_${selector}"
            done < "${disable_file}"
          else
            echo "No currently enabled selectors need to be disabled in this pass."
          fi

          # Always force the target off, then let Kconfig resolve all selects.
          "${SCRIPTS_CONFIG}" --file "${CONFIG_FILE}" --disable CONFIG_PAGE_EXTENSION
          make O="${OUTPUT_DIR}" olddefconfig

          if page_extension_is_disabled; then
            echo
            echo "CONFIG_PAGE_EXTENSION is now held at n."
            echo "PAGE_EXTENSION select-chain enforcement succeeded on pass ${pass}."
            break
          fi

          echo "CONFIG_PAGE_EXTENSION was re-enabled after olddefconfig."
          printf '%s\n' PAGE_EXTENSION "$(cat "${next_target_file}")" | awk 'NF' | sort -u > "${target_file}"

          if (( pass == MAX_PASSES )); then
            echo
            echo "ERROR: Unable to keep CONFIG_PAGE_EXTENSION=n after ${MAX_PASSES} Kconfig passes."
            echo "Direct selectors of PAGE_EXTENSION were:"
            if [[ -s "${DIRECT_FILE}" ]]; then sed 's/^/  /' "${DIRECT_FILE}"; else echo "  <none>"; fi
            echo "Current CONFIG_PAGE_EXTENSION state:"
            grep -E '^CONFIG_PAGE_EXTENSION=|^# CONFIG_PAGE_EXTENSION is not set$' "${CONFIG_FILE}" || true
            echo "Relevant Kconfig select graph:"
            grep -E '(^PAGE_EXTENSION\t|\t(PAGE_EXTENSION|CONFIG_PAGE_EXTENSION)$)' "${GRAPH_FILE}" | head -100 || true
            exit 1
          fi
        done

        echo
        echo "Final PAGE_EXTENSION state:"
        grep -E '^CONFIG_PAGE_EXTENSION=|^# CONFIG_PAGE_EXTENSION is not set$' "${CONFIG_FILE}" || true

        if ! page_extension_is_disabled; then
          echo "ERROR: CONFIG_PAGE_EXTENSION is not disabled."
          exit 1
        fi

        echo
        echo "PAGE_EXTENSION select-chain enforcement passed."

    - name: Finalize auraOS kernel configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        test -f "${OUTPUT_DIR}/.config"
        cd "${SOURCE_DIR}"
        echo "Re-asserting CONFIG_DRM=y after the PAGE_EXTENSION fixpoint loop..."
        # menuconfig DRM has: depends on (AGP || AGP=n) && !EMULATED_CMPXCHG && HAS_DMA
        # Under tristate logic, "(AGP || AGP=n)" evaluates to =m whenever
        # CONFIG_AGP=m (our allmodconfig default), which caps DRM's own
        # settable range at =m -- so "--set-val CONFIG_DRM y" can never
        # actually stick until AGP is forced to n (or y) first. This is the
        # real root cause of the drm_fb_helper/drm.ko link failures, verified
        # by replaying this exact override sequence through the real 6.8
        # Kconfig tree with kconfiglib.
        "${SOURCE_DIR}/scripts/config" --file "${OUTPUT_DIR}/.config" \
          --set-val CONFIG_AGP n \
          --set-val CONFIG_DRM y
        make O="${OUTPUT_DIR}" olddefconfig
        REQUIRED_Y=(CONFIG_MODULES CONFIG_X86_64 CONFIG_X86 CONFIG_64BIT CONFIG_KALLSYMS CONFIG_IA32_EMULATION)
        for cfg in "${REQUIRED_Y[@]}"; do
          if ! grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} is not enabled."
            exit 1
          fi
        done
        DISABLED=(CONFIG_SECURITY_APPARMOR CONFIG_UAPI_HEADER_TEST CONFIG_WERROR CONFIG_RUST CONFIG_GCC_PLUGINS CONFIG_DEBUG_INFO_BTF CONFIG_DEBUG_INFO_BTF_MODULES CONFIG_KASAN CONFIG_KCSAN CONFIG_KFENCE CONFIG_KCOV CONFIG_UBSAN CONFIG_UBSAN_TRAP CONFIG_DEBUG_OBJECTS CONFIG_DRM_I915_SW_FENCE_DEBUG_OBJECTS CONFIG_DEBUG_LIST CONFIG_DEBUG_SG CONFIG_DEBUG_NOTIFIERS CONFIG_DEBUG_KMEMLEAK CONFIG_DEBUG_PAGEALLOC CONFIG_PAGE_POISONING CONFIG_PAGE_EXTENSION CONFIG_SLUB_DEBUG CONFIG_SLAB_FREELIST_HARDENED CONFIG_SLAB_FREELIST_RANDOM CONFIG_SHUFFLE_PAGE_ALLOCATOR)
        for cfg in "${DISABLED[@]}"; do
          if grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config" || grep -q "^${cfg}=m$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} must be disabled."
            exit 1
          fi
        done
        echo
        echo "Critical configuration:"
        grep -E '^(CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_X86_64|CONFIG_X86|CONFIG_64BIT|CONFIG_IA32_EMULATION|CONFIG_DRM|CONFIG_SECURITY_APPARMOR|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_BTF_MODULES|CONFIG_UAPI_HEADER_TEST|CONFIG_WERROR|CONFIG_RUST|CONFIG_GCC_PLUGINS|CONFIG_KASAN|CONFIG_KCSAN|CONFIG_KFENCE|CONFIG_UBSAN|CONFIG_PAGE_EXTENSION)=' "${OUTPUT_DIR}/.config" || true
        echo
        echo "Checking DRM built-in/module consistency..."
        # If the DRM core is built as a module, nothing that links symbols
        # from drm.ko may be built statically into vmlinux, or the final
        # link fails with hundreds of "undefined reference to drm_*" errors
        # after the full ~20 minute compile. Catch it here instead.
        if grep -q '^CONFIG_DRM=m$' "${OUTPUT_DIR}/.config"; then
          for cfg in CONFIG_DRM_KMS_HELPER CONFIG_DRM_FBDEV_EMULATION; do
            if grep -q "^${cfg}=y\$" "${OUTPUT_DIR}/.config"; then
              echo "ERROR: CONFIG_DRM=m but ${cfg}=y (built-in code would reference drm.ko symbols)."
              echo "Either force CONFIG_DRM=y as well, or force ${cfg}=m to match."
              exit 1
            fi
          done
        fi
        echo "DRM built-in/module state is consistent."
        echo
        echo "Configuration counts:"
        printf '  Built-in: '; grep -Ec '^CONFIG_[A-Za-z0-9_]+=y$' "${OUTPUT_DIR}/.config" || true
        printf '  Modules:  '; grep -Ec '^CONFIG_[A-Za-z0-9_]+=m$' "${OUTPUT_DIR}/.config" || true
        printf '  Disabled: '; grep -Ec '^# CONFIG_[A-Za-z0-9_]+ is not set$' "${OUTPUT_DIR}/.config" || true
        echo
        echo "Kernel release:"
        make O="${OUTPUT_DIR}" -s kernelrelease

    - name: Pre-build resource check
      shell: bash
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        echo "=============================================="
        echo " Pre-build resource check"
        echo "=============================================="
        echo
        echo "Disk:"
        df -hT "${GITHUB_WORKSPACE}"
        echo
        echo "Inodes:"
        df -ih "${GITHUB_WORKSPACE}"
        echo
        echo "Memory:"
        free -h
        echo
        echo "Swap:"
        swapon --show || true
        echo
        echo "Build directory size:"
        du -sh "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" "${OUTPUT_DIR}" 2>/dev/null || true
        echo
        echo "Critical config:"
        grep -E '^(CONFIG_MODULES|CONFIG_X86_64|CONFIG_X86|CONFIG_64BIT|CONFIG_IA32_EMULATION|CONFIG_SECURITY_APPARMOR|CONFIG_DEBUG_INFO_BTF|CONFIG_UAPI_HEADER_TEST|CONFIG_WERROR|CONFIG_PAGE_EXTENSION)=' "${OUTPUT_DIR}/.config" || true

    - name: Build auraOS kernel
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        KBUILD_BUILD_USER: ${{ inputs.kernel-build-user }}
        KBUILD_BUILD_HOST: ${{ inputs.kernel-build-host }}
        KBUILD_BUILD_TIMESTAMP: ${{ inputs.kernel-build-timestamp }}
        KBUILD_BUILD_VERSION: ${{ inputs.kernel-build-version }}
        LOCALVERSION: ${{ inputs.kernel-localversion }}
        SOURCE_DATE_EPOCH: '1787184000'
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        cd "${SOURCE_DIR}"
        CPU_COUNT="$(nproc)"
        if [[ -n "${{ inputs.kernel-jobs }}" ]]; then
          JOBS="${{ inputs.kernel-jobs }}"
          if ! [[ "${JOBS}" =~ ^[0-9]+$ ]] || (( JOBS < 1 )); then
            echo "ERROR: kernel-jobs must be a positive integer."
            exit 1
          fi
        else
          if (( CPU_COUNT > 4 )); then JOBS=$((CPU_COUNT - 2)); elif (( CPU_COUNT > 2 )); then JOBS=$((CPU_COUNT - 1)); else JOBS=1; fi
        fi
        MAX_SAFE_JOBS=$((CPU_COUNT + 1))
        if (( JOBS > MAX_SAFE_JOBS )); then JOBS="${MAX_SAFE_JOBS}"; fi
        if [[ "${{ inputs.kernel-verbose }}" == "true" ]]; then VERBOSE=(V=1); else VERBOSE=(); fi
        echo "=============================================="
        echo " Building auraOS Linux kernel"
        echo "=============================================="
        echo "Kernel version:  ${{ inputs.kernel-version }}"
        echo "Local version:   ${LOCALVERSION}"
        echo "Jobs:            ${JOBS}"
        echo "CPU count:       ${CPU_COUNT}"
        echo "Architecture:    $(uname -m)"
        echo "Build user:      ${KBUILD_BUILD_USER}"
        echo "Build host:      ${KBUILD_BUILD_HOST}"
        echo "Build version:   ${KBUILD_BUILD_VERSION}"
        echo "Build timestamp: ${KBUILD_BUILD_TIMESTAMP}"
        echo "=============================================="
        export MAKEFLAGS="-Otarget"
        COMMON_ARGS=(O="${OUTPUT_DIR}" KBUILD_BUILD_USER="${KBUILD_BUILD_USER}" KBUILD_BUILD_HOST="${KBUILD_BUILD_HOST}" KBUILD_BUILD_VERSION="${KBUILD_BUILD_VERSION}" KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP}" LOCALVERSION="${LOCALVERSION}")
        if [[ "${{ inputs.ccache-enabled }}" == "true" ]] && command -v ccache >/dev/null 2>&1; then
          echo "ccache: enabled (CCACHE_DIR=${CCACHE_DIR:-unset})"
          COMMON_ARGS+=(CC="ccache gcc" HOSTCC="ccache gcc")
        else
          echo "ccache: disabled"
        fi
        echo
        echo "=== Stage 1/2: bzImage ==="
        if ! make "${COMMON_ARGS[@]}" -j"${JOBS}" "${VERBOSE[@]}" bzImage; then
          echo
          echo "bzImage failed. Retrying with -j1 V=1..."
          make "${COMMON_ARGS[@]}" -j1 V=1 bzImage
          exit 1
        fi
        echo
        echo "=== Stage 2/2: modules ==="
        if ! make "${COMMON_ARGS[@]}" -j"${JOBS}" "${VERBOSE[@]}" modules; then
          echo
          echo "modules failed. Retrying with -j1 V=1..."
          make "${COMMON_ARGS[@]}" -j1 V=1 modules
          exit 1
        fi
        echo
        echo "Kernel compilation completed."
        RELEASE="$(make O="${OUTPUT_DIR}" -s kernelrelease)"
        echo
        echo "Kernel release:"
        echo "${RELEASE}"
        echo
        echo "Kernel image:"
        ls -lh "${OUTPUT_DIR}/arch/x86/boot/bzImage"
        test -s "${OUTPUT_DIR}/arch/x86/boot/bzImage"
        test -f "${OUTPUT_DIR}/System.map"
        if [[ "${{ inputs.ccache-enabled }}" == "true" ]] && command -v ccache >/dev/null 2>&1; then
          echo
          echo "ccache stats:"
          ccache --show-stats
          du -sh "${CCACHE_DIR}" 2>/dev/null || true
        fi

    - name: Verify built kernel configuration
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        cd "${SOURCE_DIR}"
        REQUIRED_Y=(CONFIG_MODULES CONFIG_X86_64 CONFIG_X86 CONFIG_64BIT CONFIG_IA32_EMULATION)
        for cfg in "${REQUIRED_Y[@]}"; do
          if ! grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} is not enabled after compilation."
            exit 1
          fi
        done
        for cfg in CONFIG_SECURITY_APPARMOR CONFIG_UAPI_HEADER_TEST CONFIG_PAGE_EXTENSION; do
          if grep -q "^${cfg}=y$" "${OUTPUT_DIR}/.config" || grep -q "^${cfg}=m$" "${OUTPUT_DIR}/.config"; then
            echo "ERROR: ${cfg} is still enabled."
            exit 1
          fi
        done
        echo
        echo "Post-build configuration validation passed."

    - name: Install modules and generate initramfs
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"
        cd "${SOURCE_DIR}"
        RELEASE="$(make O="${OUTPUT_DIR}" -s kernelrelease)"
        echo "Kernel release: ${RELEASE}"
        rm -rf "${PACKAGE_DIR}"
        mkdir -p "${PACKAGE_DIR}/boot" "${PACKAGE_DIR}/modules"
        echo
        echo "Installing modules..."
        make O="${OUTPUT_DIR}" modules_install INSTALL_MOD_PATH="${PACKAGE_DIR}/modules" INSTALL_MOD_STRIP=1
        MODULE_ROOT="${PACKAGE_DIR}/modules/lib/modules/${RELEASE}"
        test -d "${MODULE_ROOT}"
        echo
        echo "Generating module dependency files..."
        sudo depmod -b "${PACKAGE_DIR}/modules" "${RELEASE}"
        test -f "${MODULE_ROOT}/modules.dep"
        echo
        echo "Generating initramfs..."
        sudo rm -rf "/lib/modules/${RELEASE}"
        sudo mkdir -p "/lib/modules/${RELEASE}"
        sudo rsync -a "${MODULE_ROOT}/" "/lib/modules/${RELEASE}/"
        sudo depmod "${RELEASE}"
        sudo mkinitramfs -o "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}" "${RELEASE}"
        echo
        echo "Copying kernel artifacts..."
        cp "${OUTPUT_DIR}/arch/x86/boot/bzImage" "${PACKAGE_DIR}/boot/vmlinuz-${RELEASE}"
        if [[ -f "${OUTPUT_DIR}/System.map" ]]; then cp "${OUTPUT_DIR}/System.map" "${PACKAGE_DIR}/boot/System.map-${RELEASE}"; fi
        cp "${OUTPUT_DIR}/.config" "${PACKAGE_DIR}/boot/config-${RELEASE}"
        sudo rm -rf "/lib/modules/${RELEASE}"
        echo
        echo "Package sizes:"
        du -sh "${PACKAGE_DIR}/boot" "${PACKAGE_DIR}/modules"
        echo
        echo "Package files:"
        find "${PACKAGE_DIR}" -type f -printf '%p\n' | sort

    - name: Collect build diagnostics
      if: always()
      shell: bash
      run: |
        set +e
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        echo "=============================================="
        echo " Build diagnostics"
        echo "=============================================="
        echo
        echo "Disk:"
        df -hT
        echo
        echo "Inodes:"
        df -ih
        echo
        echo "Memory:"
        free -h
        echo
        echo "Swap:"
        swapon --show || true
        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true
        echo
        echo "Build directories:"
        du -xhd2 "${BUILD_ROOT}" 2>/dev/null | sort -h | tail -50
        echo
        echo "Configuration:"
        grep -E '^(CONFIG_LOCALVERSION|CONFIG_MODULES|CONFIG_X86_64|CONFIG_X86|CONFIG_64BIT|CONFIG_IA32_EMULATION|CONFIG_SECURITY_APPARMOR|CONFIG_DEBUG_INFO_BTF|CONFIG_DEBUG_INFO_BTF_MODULES|CONFIG_UAPI_HEADER_TEST|CONFIG_WERROR|CONFIG_RUST|CONFIG_GCC_PLUGINS|CONFIG_KASAN|CONFIG_KCSAN|CONFIG_KFENCE|CONFIG_KCOV|CONFIG_UBSAN|CONFIG_DEBUG_OBJECTS|CONFIG_DRM_I915_SW_FENCE_DEBUG_OBJECTS|CONFIG_PAGE_EXTENSION)=' "${OUTPUT_DIR}/.config" 2>/dev/null || true
        echo
        echo "Kernel release:"
        if [[ -f "${OUTPUT_DIR}/.config" ]]; then
          make -C "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" O="${OUTPUT_DIR}" -s kernelrelease 2>/dev/null || true
        fi

    - name: Create auraOS kernel metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"
        RELEASE="$(make -C "${SOURCE_DIR}" O="${OUTPUT_DIR}" -s kernelrelease)"
        mkdir -p "${PACKAGE_DIR}"
        {
          echo "auraOS kernel"
          echo "Kernel version: ${{ inputs.kernel-version }}"
          echo "Ubuntu source revision: ${{ inputs.kernel-source-revision }}"
          echo "Kernel release: ${RELEASE}"
          echo "Architecture: x86_64"
          echo "Kernel config: ${{ inputs.kernel-config }}"
          echo "AppArmor: disabled"
          echo "UAPI header test: disabled"
          echo "Rust: disabled"
          echo "GCC plugins: disabled"
          echo "WERROR: disabled"
          echo "BTF: disabled"
          echo "KASAN: disabled"
          echo "KCSAN: disabled"
          echo "KFENCE: disabled"
          echo "KCOV: disabled"
          echo "UBSAN: disabled"
          echo "PAGE_EXTENSION: disabled"
          echo "Build user: ${{ inputs.kernel-build-user }}"
          echo "Build host: ${{ inputs.kernel-build-host }}"
          echo "Build version: ${{ inputs.kernel-build-version }}"
          echo "Build timestamp: ${{ inputs.kernel-build-timestamp }}"
          echo "Local version: ${{ inputs.kernel-localversion }}"
          echo "CPU count: $(nproc)"
          echo "Compiler: $(gcc --version | head -n 1)"
          echo "Compiler C++: $(g++ --version | head -n 1)"
          echo "Binutils: $(ld --version | head -n 1)"
          echo "Pahole: $(pahole --version 2>&1 | head -n 1 || true)"
        } > "${PACKAGE_DIR}/auraOS-kernel-info.txt"
        cp "${OUTPUT_DIR}/.config" "${PACKAGE_DIR}/auraOS-kernel.config"
        test -s "${PACKAGE_DIR}/auraOS-kernel-info.txt"
        test -s "${PACKAGE_DIR}/auraOS-kernel.config"

    - name: Validate final kernel artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"
        RELEASE="$(make -C "${SOURCE_DIR}" O="${OUTPUT_DIR}" -s kernelrelease)"
        echo "Validating release: ${RELEASE}"
        test -s "${OUTPUT_DIR}/arch/x86/boot/bzImage"
        test -s "${PACKAGE_DIR}/boot/vmlinuz-${RELEASE}"
        test -s "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"
        test -s "${PACKAGE_DIR}/boot/config-${RELEASE}"
        test -s "${PACKAGE_DIR}/auraOS-kernel-info.txt"
        test -s "${PACKAGE_DIR}/auraOS-kernel.config"
        test -d "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}"
        test -f "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.dep"
        test -f "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.alias"
        test -f "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.symbols"
        echo
        echo "Kernel image:"
        file "${OUTPUT_DIR}/arch/x86/boot/bzImage"
        echo
        echo "Initramfs:"
        file "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"
        echo
        echo "Final kernel artifact validation passed."

    - name: Create auraOS kernel archive
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_DATE_EPOCH: '1787184000'
      run: |
        set -euo pipefail
        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        RELEASE="$(make -C "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" O="${BUILD_ROOT}/build" -s kernelrelease)"
        cd "${BUILD_ROOT}"
        ARCHIVE="auraOS-kernel-${RELEASE}-x86_64.tar.gz"
        rm -f "${ARCHIVE}" "${ARCHIVE}.sha256"
        tar --sort=name --mtime='UTC 2026-08-20' --owner=0 --group=0 --numeric-owner -czf "${ARCHIVE}" output
        sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
        echo
        echo "Created artifacts:"
        ls -lh "${ARCHIVE}" "${ARCHIVE}.sha256"
        echo
        echo "SHA256:"
        cat "${ARCHIVE}.sha256"

    - name: Upload auraOS kernel
      uses: actions/upload-artifact@v6
      with:
        name: auraOS-linux-6.8.0-138-generic
        path: |
          ${{ github.workspace }}/auraOS-kernel/auraOS-kernel-*-x86_64.tar.gz
          ${{ github.workspace }}/auraOS-kernel/auraOS-kernel-*-x86_64.tar.gz.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 30

    - name: Final resource report
      if: always()
      shell: bash
      run: |
        set +e
        echo "=============================================="
        echo " Final resources"
        echo "=============================================="
        echo
        echo "Memory:"
        free -h
        echo
        echo "Swap:"
        swapon --show || true
        echo
        echo "Filesystem:"
        df -hT
        echo
        echo "Inodes:"
        df -ih
        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true
        echo
        echo "Build workspace:"
        if [[ -d "${GITHUB_WORKSPACE}/auraOS-kernel" ]]; then
          du -sh "${GITHUB_WORKSPACE}/auraOS-kernel" 2>/dev/null || true
        fi
        echo
        echo "auraOS kernel action finished."
