        test -s \
          "${PACKAGE_DIR}/auraOS-kernel.config"

    - name: Validate final kernel artifacts
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        SOURCE_DIR="${BUILD_ROOT}/linux-${{ inputs.kernel-version }}"
        OUTPUT_DIR="${BUILD_ROOT}/build"
        PACKAGE_DIR="${BUILD_ROOT}/output"

        RELEASE="$(
          make \
            -C "${SOURCE_DIR}" \
            O="${OUTPUT_DIR}" \
            -s \
            kernelrelease
        )"

        echo "Validating release: ${RELEASE}"

        test -s \
          "${OUTPUT_DIR}/arch/x86/boot/bzImage"

        test -s \
          "${PACKAGE_DIR}/boot/vmlinuz-${RELEASE}"

        test -s \
          "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"

        test -s \
          "${PACKAGE_DIR}/boot/config-${RELEASE}"

        test -s \
          "${PACKAGE_DIR}/auraOS-kernel-info.txt"

        test -s \
          "${PACKAGE_DIR}/auraOS-kernel.config"

        if [[ ! -d "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}" ]]; then
          echo "ERROR: Final module directory does not exist."
          exit 1
        fi

        test -f \
          "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.dep"

        test -f \
          "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.alias"

        test -f \
          "${PACKAGE_DIR}/modules/lib/modules/${RELEASE}/modules.symbols"

        echo
        echo "Verifying kernel image magic:"

        file \
          "${OUTPUT_DIR}/arch/x86/boot/bzImage"

        echo
        echo "Verifying initramfs:"

        file \
          "${PACKAGE_DIR}/boot/initrd.img-${RELEASE}"

        echo
        echo "Kernel artifact validation passed."

        echo
        echo "Artifacts:"

        find "${PACKAGE_DIR}" \
          -type f \
          -printf '%p\n' |
          sort

    - name: Create auraOS kernel archive
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_DATE_EPOCH: '1787184000'
      run: |
        set -euo pipefail

        BUILD_ROOT="${GITHUB_WORKSPACE}/auraOS-kernel"
        OUTPUT_DIR="${BUILD_ROOT}/output"

        RELEASE="$(
          make \
            -C "${BUILD_ROOT}/linux-${{ inputs.kernel-version }}" \
            O="${BUILD_ROOT}/build" \
            -s \
            kernelrelease
        )"

        cd "${BUILD_ROOT}"

        ARCHIVE="auraOS-kernel-${RELEASE}-x86_64.tar.gz"

        rm -f \
          "${ARCHIVE}" \
          "${ARCHIVE}.sha256"

        tar \
          --sort=name \
          --mtime='UTC 2026-08-20' \
          --owner=0 \
          --group=0 \
          --numeric-owner \
          -czf \
          "${ARCHIVE}" \
          output

        sha256sum \
          "${ARCHIVE}" \
          > "${ARCHIVE}.sha256"

        echo
        echo "Created artifacts:"

        ls -lh \
          "${ARCHIVE}" \
          "${ARCHIVE}.sha256"

        echo
        echo "SHA256:"

        cat \
          "${ARCHIVE}.sha256"

    - name: Upload auraOS kernel
      uses: actions/upload-artifact@v6
      with:
        name: auraOS-linux-6.8.0-138-generic
        path: |
          ${{ github.workspace }}/auraOS-kernel/auraOS-kernel-*-x86_64.tar.gz
          ${{ github.workspace }}/auraOS-kernel/auraOS-kernel-*-x86_64.tar.gz.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 30

    - name: Final resource report
      if: always()
      shell: bash
      run: |
        set +e

        echo "=============================================="
        echo " Final resources"
        echo "=============================================="

        echo
        echo "Memory:"
        free -h

        echo
        echo "Swap:"
        swapon --show || true

        echo
        echo "Filesystem:"
        df -hT

        echo
        echo "Inodes:"
        df -ih

        echo
        echo "LVM:"
        sudo pvs || true
        sudo vgs || true
        sudo lvs || true

        echo
        echo "Build workspace:"

        if [[ -d "${GITHUB_WORKSPACE}/auraOS-kernel" ]]; then
          du -sh \
            "${GITHUB_WORKSPACE}/auraOS-kernel" \
            2>/dev/null || true
        fi

        echo
        echo "auraOS kernel action finished."
